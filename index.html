<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRACE 트레이스</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 상단 워드마크 + 탭, 아래는 12열 그리드 위의 2단 작업 화면. 흑백 기반, 상태색 3개만 사용 */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --page:#F6F6F4; --ink:#111111; --ink2:#3A3A38; --muted:#6E6E6A; --dim:#A3A39E;
  --line:#E2E2DE; --line2:#CFCFCA; --soft:#F0F0EC;
  --safe:#1E7A4C; --safe-bg:#E9F3EE; --warn:#A86A12; --warn-bg:#FBF2E2; --risk:#C0392B; --risk-bg:#FBEBE8;
  --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.03em;word-break:keep-all}
.in-sub,.bubble,.in-t p,.in-end p{word-break:keep-all}
.mono{font-family:var(--mono);letter-spacing:0}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--ink)}
.hb{max-width:1240px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:28px}
.wm{display:flex;align-items:center;gap:10px;border:none;background:none;padding:0}
.wm b{font-family:var(--mono);font-weight:500;font-size:18px;letter-spacing:.18em}
.wm small{font-size:11px;color:var(--muted)}
nav.tabs{display:flex;height:100%;margin-left:auto}
nav.tabs button{height:100%;padding:0 16px;border:none;background:none;font-size:14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
nav.tabs .ct{font-family:var(--mono);font-size:11px;background:var(--risk);color:#fff;border-radius:3px;padding:0 5px;line-height:17px}

main{max-width:1240px;margin:0 auto;padding:32px 24px 72px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--line2);margin-bottom:24px;flex-wrap:wrap}
.ph .k{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.ph h1{font-size:28px;margin-top:4px}
.ph p{margin:4px 0 0;color:var(--muted);max-width:60ch}

.panel{background:var(--bg);border:1px solid var(--line);border-radius:6px}
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ptitle h2{font-size:15px}
.ptitle .no{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:8px}
.pbody{padding:18px}
.btn{height:40px;padding:0 16px;border-radius:4px;border:1px solid var(--line2);background:var(--bg);font-size:13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#333}
.btn.sm{height:32px;padding:0 10px;font-size:12px}
.seg{display:flex;border:1px solid var(--line2);border-radius:4px;overflow:hidden;width:fit-content;max-width:100%;flex-wrap:wrap}
.seg button{height:34px;padding:0 14px;border:none;border-right:1px solid var(--line2);background:var(--bg);font-size:13px;color:var(--muted)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:32px;padding:0 12px;border-radius:4px;border:1px solid var(--line2);background:var(--bg);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .x{font-family:var(--mono);opacity:.7}
.note{margin:0;font-size:12px;color:var(--muted)}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin:0 0 8px}
.empty{color:var(--muted);font-size:13px;margin:0}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:3px;padding:2px 8px;white-space:nowrap}
.st.safe{background:var(--safe-bg);color:var(--safe)}
.st.warn{background:var(--warn-bg);color:var(--warn)}
.st.risk{background:var(--risk-bg);color:var(--risk)}
.st.none{background:var(--soft);color:var(--muted)}
.st svg{flex-shrink:0}

/* 분석 */
.ana{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start}
.quick{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--bg);border:1px solid var(--line);border-radius:6px;margin-bottom:20px}
.quick .lbl{margin:0}
textarea.label{width:100%;min-height:210px;resize:vertical;border:1px solid var(--line2);border-radius:4px;padding:12px 14px;font-size:14px;line-height:1.7;background:#FCFCFB}
textarea.label:focus{outline:none;border-color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.samples{display:flex;flex-direction:column;gap:6px}
.samples button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;font-size:13px}
.samples button:hover{border-color:var(--ink)}
.samples small{color:var(--muted);font-family:var(--mono);font-size:11px}
.scanbox{position:relative;height:190px;background:var(--ink);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.scanbox video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanbox .fr{position:relative;width:62%;height:56%;border:1.5px solid rgba(255,255,255,.9);border-radius:2px;display:flex;align-items:center;justify-content:center}
.scanbox .ln{position:absolute;left:8%;right:8%;height:1px;background:#fff;box-shadow:0 0 8px #fff;animation:scan 1.8s ease-in-out infinite}
@keyframes scan{0%,100%{top:15%}50%{top:85%}}
.scanbox .camon{height:36px;padding:0 14px;border:1px solid #fff;border-radius:4px;background:transparent;color:#fff;font-size:13px}
.prods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.prods button{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:8px 10px;text-align:left;font-size:12px;display:flex;flex-direction:column}
.prods button:hover{border-color:var(--ink)}
.prods small{font-family:var(--mono);font-size:10px;color:var(--muted)}
input.code{flex:1;min-width:0;height:40px;border:1px solid var(--line2);border-radius:4px;padding:0 12px;font-family:var(--mono);font-size:13px}

.verdict{display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:center;padding:20px;border-bottom:1px solid var(--line)}
.verdict .m{width:96px;height:96px}
.verdict .k{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.verdict h2{font-size:24px;margin:2px 0 4px}
.verdict p{margin:0;color:var(--ink2)}
.verdict.safe h2{color:var(--safe)} .verdict.warn h2{color:var(--warn)} .verdict.risk h2{color:var(--risk)}
.sec{padding:16px 20px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:none}
.sec h3{font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec h3 .mono{font-weight:400;color:var(--muted);font-size:11px}
table.mine{width:100%;border-collapse:collapse;font-size:13px}
table.mine td{padding:9px 0;border-top:1px solid var(--line);vertical-align:top}
table.mine tr:first-child td{border-top:none}
table.mine td:first-child{width:110px;font-weight:500}
table.mine td:last-child{text-align:right;width:120px}
table.mine .where{color:var(--muted);font-size:12px}
.ings{display:flex;flex-direction:column}
.ig{display:grid;grid-template-columns:28px minmax(0,1fr) 140px;gap:10px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.ig:first-child{border-top:none}
.ig .n{font-family:var(--mono);font-size:11px;color:var(--dim)}
.ig .nm{font-size:13px;min-width:0}
.ig .nm small{color:var(--muted)}
.ig .bar{height:4px;background:var(--soft);border-radius:2px;position:relative}
.ig .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--line2);border-radius:2px}
.ig.hit .nm{font-weight:700}
.ig.hit.risk .bar i{background:var(--risk)} .ig.hit.risk .nm{color:var(--risk)}
.ig.hit.other .bar i{background:var(--ink)}
mark{background:none;color:inherit;border-bottom:2px solid currentColor;padding:0}
.hid{display:flex;flex-direction:column;gap:6px}
.hid div{display:flex;align-items:center;gap:10px;font-size:13px;padding:8px 10px;background:var(--soft);border-radius:4px}
.hid .ar{font-family:var(--mono);color:var(--muted)}
.cross{font-size:13px;background:var(--warn-bg);color:#6B4510;border-radius:4px;padding:10px 12px}
.foot-act{display:flex;gap:8px;flex-wrap:wrap}
.placeholder{padding:48px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.placeholder .m{width:110px;height:110px}

/* 회수 알림 */
.rc-top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.kpi b{display:block;font-family:var(--mono);font-weight:500;font-size:26px}
.kpi span{font-size:12px;color:var(--muted)}
table.list{width:100%;border-collapse:collapse;background:var(--bg);font-size:13px}
table.list th{font-weight:500;text-align:left;font-size:11px;font-family:var(--mono);letter-spacing:.08em;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line2);text-transform:uppercase}
table.list td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr.me td:first-child{box-shadow:inset 3px 0 0 var(--risk)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}

/* 기록 */
.log{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start}
.fg{display:flex;flex-direction:column;gap:14px}
.fg label.t{font-size:12px;font-weight:500;color:var(--muted);display:block;margin-bottom:6px}
.fg input[type=text],.fg input[type=date]{width:100%;height:40px;border:1px solid var(--line2);border-radius:4px;padding:0 12px;font-size:14px}
.entries{display:flex;flex-direction:column}
.en{display:grid;grid-template-columns:72px minmax(0,1fr) auto 32px;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.en:first-child{border-top:none}
.en .d{font-family:var(--mono);font-size:12px;color:var(--muted)}
.en .t{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tg{font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 5px;color:var(--muted)}
.del{width:28px;height:28px;border:none;background:none;border-radius:4px;color:var(--dim);font-family:var(--mono)}
.del:hover{background:var(--soft);color:var(--ink)}
.rb{display:flex;flex-direction:column;gap:8px}
.rr{display:grid;grid-template-columns:72px minmax(0,1fr) 100px;gap:10px;align-items:center;font-size:13px}
.rr .tr{position:relative;height:6px;background:var(--soft);border-radius:3px}
.rr .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:3px}
.rr .tr em{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--risk)}
.rr .v{text-align:right;font-family:var(--mono);font-size:12px}
.rr .v small{display:block;color:var(--muted);font-size:10px}
.callout{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.callout .m{width:72px;height:72px}
.callout h3{font-size:16px}
.callout p{margin:2px 0 0;font-size:13px;color:var(--ink2)}

/* 비상 카드 */
.card2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.show{padding:28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.show .m{width:84px;height:84px}
.show h2{font-size:24px;line-height:1.35}
.rows{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
.rows div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--ink);border-radius:4px;font-size:18px;font-weight:700}
.rows small{font-size:12px;font-weight:400;color:var(--muted)}
.emg{border-color:var(--risk)}
.emg .ptitle{background:var(--risk);color:#fff;border-bottom:none;border-radius:5px 5px 0 0}
.emg .call{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.emg .call b{font-family:var(--mono);font-size:40px;font-weight:500;line-height:1}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);font-size:14px}
ol.steps li::before{content:counter(s);font-family:var(--mono);font-size:12px;width:22px;height:22px;border:1px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center}
.big{position:fixed;inset:0;z-index:50;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px;text-align:center;overflow:auto}
.big h2{font-size:38px;line-height:1.3}
.big .rows{max-width:640px}
.big .rows div{font-size:26px;padding:16px 20px}
.big .close{position:absolute;top:20px;right:20px}

/* 내 정보 */
.me2{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:20px;align-items:start}
.avatar{padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.avatar .m{width:140px;height:140px}
.tints{display:flex;gap:8px}
.tints button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);padding:0}
.tints button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.namein{width:100%;max-width:220px;height:40px;border:1px solid var(--line2);border-radius:4px;text-align:center;font-size:15px;font-weight:700}
.agrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.agrid button{height:44px;border:1px solid var(--line2);border-radius:4px;background:var(--bg);font-size:13px;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.agrid button:hover{border-color:var(--ink)}
.agrid button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.agrid button .mono{font-size:11px;opacity:.6}
.cust{display:flex;gap:8px}
.cust input{flex:1;min-width:0;height:40px;border:1px solid var(--line2);border-radius:4px;padding:0 12px}
textarea.memo{width:100%;min-height:70px;border:1px solid var(--line2);border-radius:4px;padding:10px 12px;font-size:13px;resize:vertical}

.foot{margin-top:48px;padding-top:16px;border-top:1px solid var(--line2);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:4px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.copyfb{width:100%;min-height:110px;border:1px solid var(--line2);border-radius:4px;padding:10px;font-size:12px;font-family:var(--mono)}

/* 헤더 오른쪽 */
.hr{display:flex;align-items:center;gap:6px;margin-left:8px}
.lgb{height:32px;padding:0 10px;border:1px solid var(--line2);border-radius:4px;background:var(--bg);font-size:12px;font-weight:500}
.lgb[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.sos{height:32px;padding:0 12px;border-radius:4px;border:none;background:var(--risk);color:#fff;font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.08em}
body.lg #app{zoom:1.14}

/* 홈 */
.hero{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px 32px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:28px 36px;margin-bottom:16px}
.hero .m{width:170px;height:170px;grid-row:1 / span 3}
.hero>*:not(.m):not(.wf){grid-column:2}
.hero h1{margin-bottom:0}
.hero .sugg{margin-top:0}
.hero .who{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted)}
.hero h1{font-size:30px;margin:4px 0 16px}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;height:52px;border:1.5px solid var(--ink);border-radius:4px;padding:0 16px;font-size:16px;background:#fff}
.ask input:focus{outline:none;box-shadow:0 0 0 3px rgba(17,17,17,.1)}
.ask .btn{height:52px;padding:0 22px;font-size:15px}
.sugg{margin-top:10px}
.sugg .chip{height:30px;font-size:12px;color:var(--ink2)}
.askc{margin-bottom:16px}
.askline{font-size:18px;font-weight:700;padding:14px 16px;border:1px solid var(--ink);border-radius:4px;margin-bottom:10px}
.chip.hitc{background:var(--risk-bg);border-color:var(--risk);color:var(--risk);font-weight:700}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:18px;text-align:left;padding:20px;min-height:150px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.act:hover{border-color:var(--ink)}
.act .ic{width:46px;height:46px;border-radius:50%;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.act b{display:block;font-size:17px}
.act span:not(.ic){display:block;font-size:12px;color:var(--muted)}
.act.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.act.dark .ic{border-color:#fff}
.act.dark span:not(.ic){color:#BDBDB8}
.home3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.mini .li{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:8px 0;border-top:1px solid var(--line);line-height:1.45}
.mini .li:first-of-type{border-top:none}

/* 가이드 캐릭터 */
.guide{position:fixed;right:20px;bottom:20px;z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none}
.guide>*{pointer-events:auto}
.gbtn{width:68px;height:68px;border-radius:50%;border:1px solid var(--ink);background:var(--bg);padding:7px;box-shadow:0 6px 18px rgba(0,0,0,.12);transition:transform .15s}
.gbtn:hover{transform:translateY(-2px)}
.gtip{max-width:240px;background:var(--ink);color:#fff;font-size:12px;padding:8px 12px;border-radius:4px;position:relative;animation:tip 7s forwards}
.gtip::after{content:'';position:absolute;right:28px;bottom:-5px;width:10px;height:10px;background:var(--ink);transform:rotate(45deg)}
@keyframes tip{0%{opacity:0;transform:translateY(6px)}6%{opacity:1;transform:none}88%{opacity:1}100%{opacity:0;visibility:hidden}}

function splitTop(s){
  const out = []; let depth = 0, cur = '';
  for (const ch of s){ if (ch === '(' || ch === '[' || ch === '（') depth++; if (ch === ')' || ch === ']' || ch === '）') depth = Math.max(0, depth - 1); if ((ch === ',' || ch === '，' || ch === '、') && depth === 0){ out.push(cur); cur = ''; } else cur += ch; }
  if (cur.trim()) out.push(cur); return out.map(x => x.trim()).filter(Boolean);
}
function findAl(text){
  const hits = [];

      if (w === '밀' && /[가-힣]/.test(text[i + 1] || '') && text.slice(i, i + 3) !== '밀가루') { i = text.indexOf(w, i + 1); continue; }
      if (w === '굴' && /[뚱굴]/.test(text[i - 1] || '')) { i = text.indexOf(w, i + 1); continue; }
      if (w === '닭' && false) {}
      hits.push({k: a.k, w, i}); i = text.indexOf(w, i + 1);
    }
  }));
  const low = text.toLowerCase();

  S.custom.forEach(c => { let i = text.indexOf(c); if (i >= 0) hits.push({k: c, w: c, i}); });
  return hits;
}

  const crossRe = /(같은|동일한?)\s*(제조)?\s*시설|혼입|함유\s*가능|사용한\s*제품과|may contain|traces? of|same (facility|factory|line)|可能含有|同じ工場|生產線也處理|peut contenir|traces d|puede contener|trazas de|có thể chứa|อาจมี/i;
  let ingLine = '', crossLines = [], declLines = [];
  lines.forEach(l => { if (crossRe.test(l)) crossLines.push(l); else if (/알레르기\s*유발|^contains|^含有|一部に|アレルゲン/i.test(l)) declLines.push(l); else ingLine += (ingLine ? ', ' : '') + l; });
  ingLine = ingLine.replace(/^.*?(원재료(명)?|ingredients|ingrédients|ingredientes|thành phần|ส่วนประกอบ|配料(表)?|成分|原材料名?)\s*[:：]?\s*/i, '').replace(/[.。]\s*$/, '');
  const items = splitTop(ingLine).map((t, idx) => {
    const m = t.match(/^([^(\[]+)[(\[](.*)[)\]]\s*$/);
    const name = (m ? m[1] : t).trim(), inner = m ? m[2] : '';
    return {idx, name, inner, hits: findAl(t)};
  });
  const contains = new Map();
  items.forEach(it => it.hits.forEach(h => { if (!contains.has(h.k)) contains.set(h.k, []); const arr = contains.get(h.k); if (!arr.some(x => x.idx === it.idx)) arr.push({idx: it.idx, name: it.name, w: h.w}); }));
  declLines.forEach(l => findAl(l).forEach(h => { if (!contains.has(h.k)) contains.set(h.k, [{idx: -1, name: '알레르기 표시란', w: h.w}]); }));
  const may = new Set(); crossLines.forEach(l => findAl(l).forEach(h => { if (!contains.has(h.k)) may.add(h.k); }));
  const hidden = []; items.forEach(it => it.hits.forEach(h => { const key = Object.keys(HIDDEN).find(x => h.w.includes(x)); if (key && !hidden.some(z => z.w === key)) hidden.push({w: key, k: h.k, why: HIDDEN[key], ing: it.name}); else if (!key && isForeign(h.w) && !hidden.some(z => z.w.toLowerCase() === h.w)) hidden.push({w: it.name.match(new RegExp(h.w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i')) ? it.name.match(new RegExp(h.w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'))[0] : h.w, k: h.k, why: '외국어 표기', ing: it.name}); }));

function markText(t, hits){
  let s = esc(t); const ws = [...new Set(hits.map(h => h.w))].sort((a, b) => b.length - a.length);

}

function parseMeal(text){
  const days = []; let cur = null;
  String(text || '').split(/\n+/).map(l => l.trim()).filter(Boolean).forEach(l => {
    if (/^\d{1,2}[\/.]\d{1,2}|^[월화수목금토일]요일|\([월화수목금토일]\)$/.test(l)){ cur = {d: l, items: []}; days.push(cur); return; }
    if (!cur){ cur = {d: '오늘', items: []}; days.push(cur); }
    const codes = [...l.matchAll(/\(([\d.,\s]+)\)/g)].flatMap(m => m[1].split(/[.,\s]+/).filter(Boolean).map(Number)).filter(n => n >= 1 && n <= 19).map(n => MEAL_NO[n - 1]);
    const name = l.replace(/\(([\d.,\s]+)\)/g, '').replace(/[①-⑲*]+/g, '').trim();
    const ks = [...new Set(codes.concat(findAl(name).map(h => h.k)))];
    cur.items.push({name, ks});
  });
  return days;
}

function sampleDaily(){

async function decodeCanvas(cv){

  if (window.ZXing){ try { const r = await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(cv.toDataURL('image/png')); return r.getText(); } catch (e) {} }
  return null;
}

  ui.cam = true; ui.camErr = false; render(); loop();
}
function attachCam(){ const v = $('vid'); if (v && stream && v.srcObject !== stream){ v.srcObject = stream; v.play().catch(() => {}); } }
function stopCam(){ clearTimeout(camT); if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; ui.cam = false; }
async function loop(){
  if (!ui.cam || (ui.view === 'ar' && ui.arMode === 'radar')) return; const v = $('vid');
  if (v && v.videoWidth){ const cv = document.createElement('canvas'), k = Math.min(1, 960 / v.videoWidth); cv.width = v.videoWidth * k; cv.height = v.videoHeight * k; cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height); const c = await decodeCanvas(cv); if (c && ui.cam){ handleCode(c); return; } }
  camT = setTimeout(loop, 300);
}

/* ================= 인터랙션 ================= */
// 휠: 커서 근처 요소를 인식 박스로 잡아 성분과 확률을 표시한다. 스크롤: 카드가 살짝 출렁인다.
// 히어로: 커서가 지나간 자리에 픽셀(×) 자국이 남았다가 사라진다. 레이 눈은 커서를 따라본다.
const FX = {boxes: [], amp: 0, t: 0, dir: 1, mx: -999, my: -999, raf: 0, fraf: 0, els: [], fields: [], prev: new WeakMap(),
  RM: window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches};
const alOf = w => AL.find(a => a.w.some(x => w.includes(x)));
function fxCanvas(){ let c = $('fx'); if (!c){ c = document.createElement('canvas'); c.id = 'fx'; c.setAttribute('aria-hidden', 'true'); document.body.appendChild(c); fxResize(); } return c; }
function fxResize(){ const c = $('fx'); if (!c) return; const d = Math.min(2, window.devicePixelRatio || 1); FX.d = d; c.width = innerWidth * d; c.height = innerHeight * d; }
function fxKick(){ if (!FX.raf && !FX.RM){ fxCanvas(); FX.raf = requestAnimationFrame(fxLoop); } }
const DET = '.chip,.ig,.act,.kpi,.in-row,.phone,.st,.samples button,.agrid button,.en,.li,.hid div,.prods button,.in-stats div,.rows div,.ci-o button,.ptitle h2,.hero h1,.in-hero h1';
function fxDetect(x, y){
  const hit = document.elementsFromPoint(x, y).map(e => e.closest && e.closest(DET)).find(Boolean);
  const pool = [...document.querySelectorAll(DET)].filter(e => { const b = e.getBoundingClientRect(); return b.width > 20 && b.height > 14 && b.bottom > 60 && b.top < innerHeight; })
    .map(e => { const b = e.getBoundingClientRect(); return {e, d: Math.hypot(b.left + b.width / 2 - x, b.top + b.height / 2 - y)}; }).sort((p, q) => p.d - q.d);
  const picks = []; if (hit) picks.push(hit);
  for (const o of pool){ if (picks.length >= 2) break; if (!picks.includes(o.e) && o.d < 360 && !picks.some(p => p.contains(o.e) || o.e.contains(p))) picks.push(o.e); }
  const mine = myList();
  picks.forEach(e => {
    if (FX.boxes.some(b => b.e === e)) return;
    const al = alOf(e.textContent || ''), pct = al ? 78 + Math.floor(Math.random() * 21) : 12 + Math.floor(Math.random() * 60);
    FX.boxes.push({e, life: 1, born: performance.now(), label: (al ? al.k + ' ' : '') + pct + '%', risk: !!(al && mine.includes(al.k))});
  });
  while (FX.boxes.length > 4) FX.boxes.shift();
  fxKick();
}
function fxLoop(now){
  FX.raf = 0; const c = fxCanvas(), g = c.getContext('2d'), d = FX.d || 1;
  g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, innerWidth, innerHeight);
  g.font = '500 10px "IBM Plex Mono", monospace'; g.textBaseline = 'middle';
  FX.boxes = FX.boxes.filter(b => b.e.isConnected && b.life > .02);
  FX.boxes.forEach(b => {
    const age = (now - b.born) / 1000; if (age > .9) b.life *= .86;
    const r = b.e.getBoundingClientRect(), pad = 4 + Math.max(0, .18 - age) * 40;
    const x = r.left - pad, y = r.top - pad, w = r.width + pad * 2, h = r.height + pad * 2, col = b.risk ? '229,72,77' : '63,81,230';
    g.globalAlpha = b.life;
    g.fillStyle = `rgba(${col},.06)`; g.fillRect(x, y, w, h);
    g.lineWidth = 1; g.strokeStyle = `rgba(${col},.85)`; g.strokeRect(x + .5, y + .5, w, h);
    const lw = g.measureText(b.label).width + 10, ly = y - 15 < 0 ? y : y - 15;
    g.fillStyle = `rgb(${col})`; g.fillRect(x, ly, lw, 15); g.fillStyle = '#fff'; g.fillText(b.label, x + 5, ly + 8);
  });
  g.globalAlpha = 1;
  FX.amp *= .88; FX.t++;
  const on = FX.amp > .1;
  FX.els.forEach(el => {
    if (!on){ if (el.style.translate) el.style.translate = ''; return; }
    const r = el.getBoundingClientRect(); if (r.bottom < -50 || r.top > innerHeight + 50) return;
    el.style.translate = `0 ${(FX.amp * Math.sin(FX.t * .2 - (r.top + r.height / 2) * .011) * FX.dir).toFixed(2)}px`;
  });
  if (FX.boxes.length || on) FX.raf = requestAnimationFrame(fxLoop); else g.clearRect(0, 0, innerWidth, innerHeight);
}
const WAVE_SEL = '#app .panel, #app .act, #app .hero, #app .kpi, #app .quick, #app .tw, #intro .in-row, #intro .phone, #intro .in-copy, #intro .in-end';
function fxBind(){
  FX.els = FX.RM ? [] : [...document.querySelectorAll(WAVE_SEL)];
  FX.fields = [...document.querySelectorAll('#intro canvas.wf')].filter(cv => cv.isConnected).map(cv => {
    const W = cv.clientWidth, H = cv.clientHeight, d = Math.min(2, window.devicePixelRatio || 1), S = 9; cv.width = W * d; cv.height = H * d;
    const cols = Math.ceil(W / S), rows = Math.ceil(H / S);
    return {cv, W, H, d, S, cols, rows, v: new Float32Array(cols * rows), n: Float32Array.from({length: cols * rows}, () => Math.random())};
  });
  if (FX.fields.length && !FX.fraf && !FX.RM) FX.fraf = requestAnimationFrame(fieldLoop);
  fxEyes();
}
function fieldLoop(){
  FX.fraf = 0; let any = false; const R = 64;
  FX.fields.forEach(F => {
    if (!F.cv.isConnected) return; any = true;
    const b = F.cv.getBoundingClientRect(); if (b.bottom < 0 || b.top > innerHeight || !b.width) return;
    const g = F.cv.getContext('2d'), S = F.S; g.setTransform(F.d, 0, 0, F.d, 0, 0); g.clearRect(0, 0, F.W, F.H);
    const mx = FX.mx - b.left, my = FX.my - b.top, near = mx > -R && my > -R && mx < F.W + R && my < F.H + R;
    if (near){ const c0 = Math.max(0, Math.floor((mx - R) / S)), c1 = Math.min(F.cols - 1, Math.floor((mx + R) / S)), r0 = Math.max(0, Math.floor((my - R) / S)), r1 = Math.min(F.rows - 1, Math.floor((my + R) / S));
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++){ const i = r * F.cols + c, k = 1 - Math.hypot(c * S + S / 2 - mx, r * S + S / 2 - my) / R; if (k > 0 && F.n[i] < .35 + k * .8) F.v[i] = Math.max(F.v[i], k); } }
    g.lineWidth = 1.3; g.lineCap = 'round';
    for (let i = 0; i < F.v.length; i++){
      const v = F.v[i]; if (v < .03) continue; F.v[i] = v * .955;
      const x = (i % F.cols) * S + S / 2, y = Math.floor(i / F.cols) * S + S / 2, a = 1.8;
      g.strokeStyle = v > .5 ? `rgba(63,81,230,${Math.min(1, v * 1.3)})` : `rgba(169,180,248,${v * 1.6})`;
      g.beginPath(); g.moveTo(x - a, y - a); g.lineTo(x + a, y + a); g.moveTo(x + a, y - a); g.lineTo(x - a, y + a); g.stroke();
    }
  });
  if (any) FX.fraf = requestAnimationFrame(fieldLoop);
}
function fxEyes(){
  FX.eq = 0; if (FX.mx < -900) return;
  document.querySelectorAll('svg.rei').forEach(sv => {
    const b = sv.getBoundingClientRect(); if (!b.width || b.bottom < 0 || b.top > innerHeight) return;
    const dx = FX.mx - (b.left + b.width / 2), dy = FX.my - (b.top + b.height / 2), dist = Math.hypot(dx, dy) || 1, m = Math.min(3.4, dist / 50);
    const tr = `translate(${(dx / dist * m).toFixed(2)} ${(dy / dist * m).toFixed(2)})`;
    sv.querySelectorAll('.pu').forEach(p => p.setAttribute('transform', tr));
  });
}
addEventListener('resize', () => { fxResize(); fxBind(); });
addEventListener('pointermove', e => {
  FX.mx = e.clientX; FX.my = e.clientY;
  const ib = $('intro'); if (ib && !ib.hidden){ ib.style.setProperty('--gx', e.clientX + 'px'); ib.style.setProperty('--gy', e.clientY + 'px'); }
  const gl = e.target.closest && e.target.closest('.hero,.in-end');
  if (gl && !FX.RM){ const r = gl.getBoundingClientRect(); gl.style.setProperty('--gx', (e.clientX - r.left) + 'px'); gl.style.setProperty('--gy', (e.clientY - r.top) + 'px'); gl.classList.add('glow'); }
  if (FX.glow && FX.glow !== gl) FX.glow.classList.remove('glow'); FX.glow = gl;
  if (!FX.eq) FX.eq = requestAnimationFrame(fxEyes);
  const ms = e.target.closest && e.target.closest('#menuStage'), mc = ms && $('msCard');
  if (mc && !FX.RM){ const r = ms.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height; mc.style.transform = `perspective(1000px) rotateX(${(10 - (py - .5) * 10).toFixed(2)}deg) rotateY(${((px - .5) * 12).toFixed(2)}deg) rotateZ(-2deg)`; }
  const a = e.target.closest && e.target.closest('.act');
  if (FX.tilt && FX.tilt !== a) FX.tilt.style.transform = '';
  FX.tilt = a;
  if (a && !FX.RM){ const r = a.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    a.style.transform = `perspective(700px) rotateX(${((.5 - py) * 6).toFixed(2)}deg) rotateY(${((px - .5) * 8).toFixed(2)}deg) translateY(-2px)`;
    a.style.setProperty('--mx', (px * 100).toFixed(1) + '%'); a.style.setProperty('--my', (py * 100).toFixed(1) + '%'); }
}, {passive: true});
document.addEventListener('scroll', e => {
  if (FX.RM) return; const t = e.target === document ? document.scrollingElement : e.target; if (!t) return;
  const y = t.scrollTop, p = FX.prev.has(t) ? FX.prev.get(t) : y; FX.prev.set(t, y);
  const dlt = y - p; if (!dlt) return;
  FX.amp = Math.min(6, FX.amp + Math.abs(dlt) * .03); FX.dir = Math.sign(dlt); fxKick();
}, {capture: true, passive: true});
document.addEventListener('pointerdown', e => {
  if (FX.RM) return;
  const el = e.target.closest('.btn,.chip,.act,.agrid button,.ci-o button,.ob-opts button,.samples button,.prods button,.shapes button,.seg button');
  if (el){ const r = el.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2.2, sp = document.createElement('span'); sp.className = 'rp';
    sp.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`; el.appendChild(sp); setTimeout(() => sp.remove(), 650); }
  const m = e.target.closest('.gbtn,.hero>.m,.avatar>.m,.ob-m,.in-end .m,.ci-q .m,.ci-done .m');
  if (m){ m.classList.remove('squish'); void m.offsetWidth; m.classList.add('squish'); }
}, true);

if (S.trip && S.trip.on) ui.lang = TRIPS[S.trip.c].l;
window.TRACE_GO = v => { if (v === 'intro'){ ui.ob = {stage: 'land', step: 0}; renderIntro(); return; } ui.ob.stage = null; renderIntro(); stopCam(); ui.view = v; ui.gOpen = false; render(); window.scrollTo({top: 0}); };
ui.res = analyzeLabel(ui.text);
render();
renderIntro();
</script>
