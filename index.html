/* ================= 식단 짜기 ================= */
// 같은 예측 모델로 후보 조합의 혈당 곡선을 계산하고, 목표 범위 안에 들어오는 조합 중에서 겹치지 않게 고른다
const PSLOT = {b: '아침', l: '점심', d: '저녁', s: '간식'};
const PPOOL = {
  bMain: ['통밀빵 2장', '현미밥', '잡곡밥', '오트밀', '찐 고구마'], bPro: ['삶은 달걀 2개', '그릭 요거트', '두부 부침', '계란말이'], bSide: ['사과', '바나나', '데친 브로콜리', null],
  main: ['현미밥', '잡곡밥', '흰쌀밥'], pro: ['고등어구이', '연어구이', '닭가슴살 구이', '두부 부침', '계란말이', '삼겹살 1인분'], veg: ['시금치나물', '데친 브로콜리', '오이무침'], soup: ['된장찌개', '미역국', '김치찌개', null],
  out: [['비빔밥'], ['쌀국수'], ['닭가슴살 샐러드'], ['김밥', '삶은 달걀 2개'], ['초밥 10피스', '미역국'], ['짬뽕'], ['크림 파스타', '닭가슴살 샐러드'], ['카레라이스', '오이무침']],
  snack: ['견과류 한 줌', '그릭 요거트', '사과', '삶은 달걀 2개', '데친 브로콜리']
};
const PEXC = {noodle: '면', bread: '빵', pork: '돼지고기', fish: '생선', dairy: '유제품'};
const pexcHit = (n, ex) => (ex.noodle && FOODS[n] && FOODS[n].cat === 'noodle') || (ex.bread && FOODS[n] && FOODS[n].cat === 'bread') || (ex.pork && /삼겹살|김치찌개/.test(n)) || (ex.fish && /고등어|연어|초밥/.test(n)) || (ex.dairy && /요거트|파스타/.test(n));
const pick = a => a[Math.floor(Math.random() * a.length)];
function planCombo(slot, o){
  const out = o.style === 'out' && (slot === 'l' || slot === 'd') && Math.random() < .6;
  let items;
  if (slot === 's') items = [pick(PPOOL.snack)];
  else if (slot === 'b') items = [pick(PPOOL.bMain), pick(PPOOL.bPro), pick(PPOOL.bSide)];
  else if (out) items = pick(PPOOL.out).slice();
  else items = [pick(PPOOL.main), pick(PPOOL.pro), pick(PPOOL.veg), pick(PPOOL.soup)];
  items = [...new Set(items.filter(Boolean))];
  if (items.some(n => pexcHit(n, o.ex) || (o.no || []).some(w => w && n.includes(w)))) return null;
  return {items: items.map(n => ({n, k: 1})), out};
}
function planScore(c, slot){
  const veg = c.items.some(it => ['side', 'veg', 'soup'].includes(FOODS[it.n].cat));
  const opt = {time: slot === 's' ? 'l' : slot, order: veg && c.items.length > 1 ? 'veg' : null};
  let R = predict(c.items, ctx(opt));
  // 목표를 넘으면 밥 양을 줄여 본다
  if (R.peak > R.hi - 10){ const ri = c.items.findIndex(it => /^(흰쌀밥|현미밥|잡곡밥)$/.test(it.n)); if (ri >= 0) for (const k of [.75, .5]){ c.items[ri].k = k; R = predict(c.items, ctx(opt)); if (R.peak <= R.hi - 10) break; } }

}
function planMeal(slot, o, used){
  const cand = [];
  for (let i = 0; i < 60; i++){ const c = planCombo(slot, o); if (c) cand.push(planScore(c, slot)); }
  if (!cand.length) return null;
  const pen = c => c.R.peak + c.items.reduce((s, it) => s + (used[it.n] || 0) * 45, 0) + (c.items.some(it => /삼겹살|크림 파스타|카레/.test(it.n)) ? 8 : 0);
  cand.sort((a, b) => pen(a) - pen(b));
  const ok = cand.filter(c => c.R.peak <= c.R.hi - 5), pool = (ok.length ? ok : cand).slice(0, 5), m = pick(pool);
  m.items.forEach(it => used[it.n] = (used[it.n] || 0) + 1);
  const tips = [];
  if (m.order === 'veg') tips.push('채소 → 단백질 → 밥 순서');
  if (m.items.some(it => it.k < 1)) tips.push(`${m.items.find(it => it.k < 1).n} ${m.items.find(it => it.k < 1).k === .5 ? '반' : '3/4'} 공기`);
  if (m.R.peak > m.R.hi - 25 && slot !== 's') tips.push('식후 10분 걷기');
  return {slot, items: m.items, out: m.out, peak: m.R.peak, carbs: m.R.carbs, tips, order: m.order};
}
function planMake(){
  const o = S.planOpt, days = o.days === 7 ? 7 : 1, used = {}, plan = [];
  for (let d = 0; d < days; d++){ const day = {meals: []}; Object.keys(used).forEach(k => used[k] *= .8); o.slots.forEach(s => { const m = planMeal(s, o, used); if (m) day.meals.push(m); }); plan.push(day); }
  S.plan = {at: Date.now(), days: plan, opt: JSON.parse(JSON.stringify(o))}; save();
}
function planList(){ const c = {}; (S.plan ? S.plan.days : []).forEach(d => d.meals.forEach(m => m.items.forEach(it => { c[it.n] = (c[it.n] || 0) + it.k; }))); return Object.entries(c).sort((a, b) => b[1] - a[1]); }
function mealLine(m, di, mi){
  const R = predict(m.items, ctx({time: m.slot === 's' ? 'l' : m.slot, order: m.order})), v = verdictOf(R);
  return `<div class="pmeal"><div class="pm-h"><span class="pm-s">${PSLOT[m.slot]}</span>${m.out ? '<span class="st pri">외식</span>' : ''}${stTag(v, `최고 ${R.peak}`)}</div>
    <b class="pm-n">${m.items.map(it => esc(it.n) + (it.k !== 1 ? ` <small>×${it.k}</small>` : '')).join(' · ')}</b>
    <div class="pm-c">${curveSVG([{R, col: v === 'risk' ? '#E5484D' : '#3F51E6'}], {h: 90, labels: false})}</div>

}
function planV(){
  if (!S.planOpt) S.planOpt = {days: 1, slots: ['b', 'l', 'd'], style: 'home', ex: {}, no: []};
  const o = S.planOpt, P = S.plan, di = Math.min(ui.planDay || 0, P ? P.days.length - 1 : 0);
  const A = `<section class="card fg"><div class="card-h" style="margin:0"><b>조건</b><span class="note">${TYPEN[S.type]} · 목표 ${hiOf()} 이하</span></div>
    <div><label class="t">기간</label><div class="seg">${[[1, '오늘 하루'], [7, '일주일']].map(([v, n]) => `<button aria-pressed="${o.days === v}" data-popt="days:${v}">${n}</button>`).join('')}</div></div>
    <div><label class="t">끼니</label><div class="chips wrap">${Object.keys(PSLOT).map(k => `<button class="chip" aria-pressed="${o.slots.includes(k)}" data-pslot="${k}">${PSLOT[k]}</button>`).join('')}</div></div>
    <div><label class="t">스타일</label><div class="seg">${[['home', '집밥 위주'], ['out', '외식 섞기']].map(([v, n]) => `<button aria-pressed="${o.style === v}" data-popt="style:${v}">${n}</button>`).join('')}</div></div>
    <div><label class="t">빼고 싶은 것</label><div class="chips wrap">${Object.keys(PEXC).map(k => `<button class="chip" aria-pressed="${!!o.ex[k]}" data-pex="${k}">${PEXC[k]}</button>`).join('')}</div></div>
    <div><label class="t" for="pno">못 먹는 음식 직접 입력</label><input type="text" id="pno" maxlength="40" placeholder="예: 고등어, 김치" value="${esc((o.no || []).join(', '))}"></div>

  let B = `<section class="card"><div class="empty"><div class="m">${mascot('think')}</div><b>조건을 고르고 ‘식단 짜기’를 눌러요</b><p class="note">끼니마다 예상 곡선과 먹는 순서 팁이 같이 나와요</p></div></section>`;

      <div class="today" style="margin-bottom:12px"><div><span>하루 탄수화물</span><b>${tc}<small>g</small></b></div><div><span>가장 높은 끼니</span><b>${mx}</b></div><div><span>끼니</span><b>${D.meals.length}<small>번</small></b></div></div>
      ${D.meals.map((m, mi) => mealLine(m, di, mi)).join('')}</section>
      <section class="card"><div class="card-h"><b>장보기 목록</b><span class="note">${P.days.length}일치</span></div><div class="shop">${planList().map(([n, k]) => `<span><b>${esc(n)}</b>${k !== 1 ? ` ×${Math.round(k * 100) / 100}` : ''}</span>`).join('')}</div></section>
      <p class="note center">예시 식단이에요. 열량과 영양 균형은 사람마다 다르니 약을 쓰고 있다면 의료진·영양사와 함께 조정하세요.</p>`; }

}

/* ================= 인터랙션 (TRACE와 같은 효과) ================= */
// 스크롤·휠: 카드가 물결처럼 살짝 출렁인다. 히어로: 커서가 지나간 자리에 × 픽셀이 남았다 사라진다.
// 버튼: 눌린 자리에서 번지는 물결. 캐릭터: 누르면 말랑하게 눌리고, 눈이 커서를 따라본다. 히어로·마무리 카드: 커서를 따라 번지는 블루 빛
const FX = {amp: 0, t: 0, dir: 1, mx: -999, my: -999, raf: 0, fraf: 0, els: [], fields: [], prev: new WeakMap(),
  RM: window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches};
const WAVE_SEL = '#app .card, #app .row, #app .pred, #app .game-card, #app .hero, #app .sos-top, #app .call, #app .stage, #app .act, #app .pitem, #intro .in-row, #intro .phone, #intro .in-copy, #intro .in-end, #intro .ob-opts button';
function fxKick(){ if (!FX.raf && !FX.RM) FX.raf = requestAnimationFrame(fxLoop); }
function fxLoop(){
  FX.raf = 0; FX.amp *= .88; FX.t++;
  const on = FX.amp > .1;
  FX.els.forEach(el => {
    if (!on){ if (el.style.translate) el.style.translate = ''; return; }
    const r = el.getBoundingClientRect(); if (r.bottom < -50 || r.top > innerHeight + 50) return;
    el.style.translate = `0 ${(FX.amp * Math.sin(FX.t * .2 - (r.top + r.height / 2) * .011) * FX.dir).toFixed(2)}px`;
  });

}
function fxBind(){
  FX.els = FX.RM ? [] : [...document.querySelectorAll(WAVE_SEL)];
  FX.fields = [...document.querySelectorAll('canvas.wf')].filter(cv => cv.isConnected && cv.clientWidth).map(cv => {
    const W = cv.clientWidth, H = cv.clientHeight, d = Math.min(2, window.devicePixelRatio || 1), S = 9; cv.width = W * d; cv.height = H * d;
    const cols = Math.ceil(W / S), rows = Math.ceil(H / S);
    return {cv, W, H, d, S, cols, rows, v: new Float32Array(cols * rows), n: Float32Array.from({length: cols * rows}, () => Math.random())};
  });
  if (FX.fields.length && !FX.fraf && !FX.RM) FX.fraf = requestAnimationFrame(fieldLoop);
  fxEyes();
}
function fieldLoop(){
  FX.fraf = 0; let any = false; const R = 64;
  FX.fields.forEach(F => {
    if (!F.cv.isConnected) return; any = true;
    const b = F.cv.getBoundingClientRect(); if (b.bottom < 0 || b.top > innerHeight || !b.width) return;
    const g = F.cv.getContext('2d'), S = F.S; g.setTransform(F.d, 0, 0, F.d, 0, 0); g.clearRect(0, 0, F.W, F.H);

function introFx(el){
  if (!el || el.dataset.stage !== 'land') return;
  const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let bar = el.querySelector('.ix-bar'); if (!bar){ bar = document.createElement('div'); bar.className = 'ix-bar'; el.prepend(bar); }
  // 제목을 줄 단위로 감싸 순서대로 올린다
  const h1 = el.querySelector('.in-hero h1'); if (h1 && !h1.dataset.split){ h1.dataset.split = 1; h1.innerHTML = h1.innerHTML.split(/<br\s*\/?>/i).map((t, i) => `<span class="ix-ln"><span style="--d:${.12 + i * .12}s">${t}</span></span>`).join(''); }
  const cp = el.querySelector('.in-copy'); if (cp){ [...cp.children].forEach((c, i) => { if (c.tagName !== 'H1') c.style.setProperty('--d', (.18 + i * .1) + 's'); c.classList.add('ix-up'); }); requestAnimationFrame(() => cp.classList.add('ix-on')); }
  el.querySelectorAll('.in-row').forEach(r => r.classList.add('ix-row'));
  el.querySelectorAll('.in-stats b').forEach(b => { const n = parseInt(b.textContent, 10); if (!isNaN(n) && /^\d+$/.test(b.textContent.trim())) b.dataset.to = n; });
  const top = el.querySelector('.in-top'), phone = el.querySelector('.in-hero .phone');
  let counted = false;
  const count = () => { if (counted) return; counted = true; el.querySelectorAll('.in-stats b[data-to]').forEach(b => { const to = +b.dataset.to, t0 = performance.now(); const f = n => { const k = Math.min(1, (n - t0) / 1300); b.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); }; b.textContent = 0; requestAnimationFrame(f); }); };
  setTimeout(count, RM ? 0 : 500);
  const on = () => {
    const y = el.scrollTop, max = el.scrollHeight - el.clientHeight;
    bar.style.transform = `scaleX(${max > 0 ? y / max : 0})`;
    if (top) top.classList.toggle('ix-sm', y > 30);
    if (phone && !RM) phone.style.transform = `translateY(${Math.min(120, y * .18)}px) rotate(${Math.min(4, y * .008)}deg)`;
  };
  el.addEventListener('scroll', on, {passive: true}); on();
}
