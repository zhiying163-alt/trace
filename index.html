<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3F51E6">
<title>당미리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js" defer></script>
<style>
:root{
  color-scheme:light;
  --bg:#FFFFFF; --page:#F7F8FC; --ink:#1A2050; --ink2:#3B4270; --muted:#7A80A0; --dim:#B3B8CF;
  --line:#E8EAF3; --line2:#D6DAEA; --soft:#F1F3FA;
  --pri:#3F51E6; --pri2:#6E7FF3; --pri-bg:#EEF0FE;
  --safe:#24A05E; --safe-bg:#E2F6EA; --warn:#D48A16; --warn-bg:#FDF0DA; --risk:#E5484D; --risk-bg:#FDE8E7;
  --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --w:520px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body.lg{font-size:16px}
button,input,textarea,select{font-family:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.03em;word-break:keep-all}
p{word-break:keep-all}
.mono{font-family:var(--mono);letter-spacing:0}
html{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}::-webkit-scrollbar-track{background:transparent}

/* 헤더 */
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 1px 0 var(--line)}
.hb{max-width:var(--w);margin:0 auto;height:56px;padding:0 16px;display:flex;align-items:center;gap:10px}
.wm{display:flex;align-items:center;gap:8px;border:none;background:none;padding:0}
.wm .m{width:30px;height:30px}
.wm b{font-size:18px;color:var(--pri);letter-spacing:-.04em}
.wm small{font-size:11px;color:var(--muted);font-weight:500}
.mtitle{font-size:17px;font-weight:700}
.mtitle.large{font-size:22px}
.hr{margin-left:auto;display:flex;align-items:center;gap:6px}
.ib{width:38px;height:38px;border-radius:12px;border:none;background:none;display:grid;place-items:center;color:var(--ink2);position:relative}
.ib:hover{background:var(--soft)}
.sos{height:34px;padding:0 12px;border-radius:999px;border:none;background:var(--risk);color:#fff;font-weight:700;font-size:12px;letter-spacing:.04em;display:flex;align-items:center;gap:5px}
.sos i{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.back{width:38px;height:38px;border:none;background:none;border-radius:12px;display:grid;place-items:center;color:var(--ink)}

main{max-width:var(--w);margin:0 auto;padding:14px 16px 120px;animation:appin .26s ease-out}
@keyframes appin{from{opacity:0;transform:translateY(6px)}}

/* 하단 독 */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:var(--w);z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
.dock button{height:60px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:var(--muted);font-weight:500}
.dock button[aria-current="page"]{color:var(--pri);font-weight:700}
.dock .fab span{width:54px;height:54px;border-radius:18px;background:var(--pri);color:#fff;display:grid;place-items:center;margin-top:-26px;box-shadow:0 8px 20px rgba(63,81,230,.35);transition:transform .15s}
.dock .fab:active span{transform:scale(.94)}
.dock .fab[aria-current="page"] span{background:var(--ink)}

/* 공통 */
.card{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.card-h b{font-size:15px}
.card-h .note{margin:0}
.note{font-size:12px;color:var(--muted)}
.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--pri);text-transform:uppercase}
.btn{height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.red{background:var(--risk);border-color:var(--risk);color:#fff}
.btn.soft{background:var(--pri-bg);border-color:var(--pri-bg);color:var(--pri)}
.btn.sm{height:34px;padding:0 12px;font-size:12.5px;border-radius:11px}
.btn.w{width:100%}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
.link{border:none;background:none;color:var(--pri);font-weight:600;font-size:13px;padding:4px}
.chip{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);background:var(--bg);font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.chip[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;height:34px;border:none;background:none;border-radius:9px;font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--pri);box-shadow:0 1px 3px rgba(26,32,80,.12)}
input[type=text],input[type=number],input[type=tel],textarea,select{width:100%;height:46px;border:1px solid var(--line2);border-radius:14px;padding:0 14px;font-size:15px;background:var(--bg)}
textarea{height:110px;padding:12px 14px;resize:vertical;line-height:1.5}
input:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-bg)}
label.t{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin:0 0 6px}
.fg>*+*{margin-top:12px}
.st{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.st.safe{background:var(--safe-bg);color:var(--safe)}.st.warn{background:var(--warn-bg);color:var(--warn)}.st.risk{background:var(--risk-bg);color:var(--risk)}.st.pri{background:var(--pri-bg);color:var(--pri)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--dim)}
.dot.safe{background:var(--safe)}.dot.warn{background:var(--warn)}.dot.risk{background:var(--risk)}.dot.pri{background:var(--pri)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:var(--bg);text-align:left;margin-bottom:10px}
.row>div{flex:1;min-width:0}
.row b{display:block;font-size:14.5px}
.row span.s{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.row .chev{color:var(--dim);font-size:22px;line-height:1}
.row .ic{width:42px;height:42px;border-radius:14px;background:var(--pri-bg);color:var(--pri);display:grid;place-items:center;flex:none}
.row.alert{border-color:#F7C6C4;background:var(--risk-bg)}
.row.alert .ic{background:#fff;color:var(--risk)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.kv:first-child{border-top:none}
.kv span{color:var(--muted)}
.kv b{text-align:right}
.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:13px}
.empty .m{width:64px;height:64px;margin:0 auto 6px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:90;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

/* 홈 */
.hero{position:relative;padding:8px 0 4px}
.hero-t{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hero .hk{font-size:13px;color:var(--muted);margin:0 0 4px;font-weight:500}
.hero h1{font-size:25px;line-height:1.28}
.hero h1 em{font-style:normal;color:var(--pri)}
.hero .m{width:82px;height:82px;flex:none;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.search{display:flex;align-items:center;gap:8px;height:54px;border-radius:18px;background:var(--bg);border:1.5px solid var(--pri);padding:0 8px 0 16px;margin:14px 0 10px;box-shadow:0 6px 18px rgba(63,81,230,.1)}
.search input{border:none;height:100%;padding:0;font-size:15px;box-shadow:none!important;background:none}
.search .go{height:40px;padding:0 14px;border-radius:12px;border:none;background:var(--pri);color:#fff;font-weight:700;font-size:13px;flex:none}
.pred{background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;position:relative;overflow:hidden}
.pred-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pred-h h2{font-size:19px}
.pred-h .u{font-size:12px;color:var(--muted)}
.pred-h .m{width:56px;height:56px;flex:none;margin:-4px -2px 0 0}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.nums div{background:var(--soft);border-radius:14px;padding:9px 10px}
.nums span{display:block;font-size:11px;color:var(--muted)}
.nums b{font-size:18px;font-family:var(--mono);letter-spacing:-.02em;font-weight:500}
.nums b small{font-size:11px;color:var(--muted);margin-left:2px;font-family:var(--sans)}
.nums .hl{background:var(--pri-bg)}.nums .hl b{color:var(--pri)}
.verdict{display:flex;align-items:center;gap:8px;margin:6px 0 0}
.verdict .vk{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;font-weight:500}
.verdict.safe .vk{color:var(--safe)}.verdict.warn .vk{color:var(--warn)}.verdict.risk .vk{color:var(--risk)}
.tips{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.tips li{display:flex;align-items:center;gap:10px;background:var(--pri-bg);border-radius:14px;padding:10px 12px;font-size:13px}
.tips li b{margin-left:auto;font-family:var(--mono);color:var(--pri);font-weight:500;white-space:nowrap}
.tips li i{font-style:normal;width:24px;height:24px;border-radius:8px;background:#fff;color:var(--pri);display:grid;place-items:center;flex:none;font-size:12px;font-weight:700}
.cond{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.cond>span{font-size:12px;color:var(--muted);font-weight:600}
.cond .seg button{height:30px;font-size:12px}
.today{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.today div{background:var(--soft);border-radius:14px;padding:10px 12px}
.today span{display:block;font-size:11px;color:var(--muted)}
.today b{font-family:var(--mono);font-size:20px;font-weight:500}
.today b small{font-family:var(--sans);font-size:11px;color:var(--muted);margin-left:2px}
.game-card{display:flex;align-items:center;gap:14px;width:100%;border:none;border-radius:22px;padding:16px;background:var(--pri);color:#fff;text-align:left;margin-bottom:12px;position:relative;overflow:hidden}
.game-card::after{content:'';position:absolute;right:-30px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.game-card .gimg{width:66px;height:66px;flex:none;border-radius:18px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.game-card b{display:block;font-size:17px}
.game-card span{font-size:12.5px;opacity:.85}
.game-card .play{margin-left:auto;height:36px;padding:0 14px;border-radius:12px;background:#fff;color:var(--pri);font-weight:700;font-size:13px;display:flex;align-items:center;flex:none;position:relative;z-index:1}

/* 혈당 곡선 */
.gcurve{width:100%;height:auto;display:block;margin-top:8px;overflow:visible}
.gcurve .band{fill:var(--safe-bg);opacity:.75}
.gcurve .gl{stroke:var(--line);stroke-width:1}
.gcurve .gl.gm{stroke:#BFE5CD;stroke-dasharray:3 3}
.gcurve .gt{font-size:10px;fill:var(--muted);font-family:var(--mono)}
.gcurve .garea{opacity:.08}
.gcurve .gp{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.gcurve .gp.dash{stroke-width:2;stroke-dasharray:5 5}
.gcurve .gd{fill:#fff;stroke-width:2.5}
.gcurve .gv{font-size:12px;font-weight:700;font-family:var(--mono)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend i.d{background:repeating-linear-gradient(90deg,var(--dim) 0 4px,transparent 4px 7px)!important}

/* 바텀시트 */
.sheet-bg{position:fixed;inset:0;background:rgba(26,32,80,.32);z-index:60;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:var(--w);max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;z-index:61;padding:8px 18px calc(24px + env(safe-area-inset-bottom,0));animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translate(-50%,40px);opacity:.4}}
.sheet .grab{display:block;width:40px;height:5px;border-radius:9px;background:var(--line2);margin:4px auto 12px}
.sheet h3.sh{font-size:17px;margin:0 0 12px}
.sheet .x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;border:none;background:var(--soft);font-size:18px;color:var(--muted)}
.vhero{display:flex;gap:12px;align-items:center;padding:12px;border-radius:20px;margin-bottom:6px}
.vhero.safe{background:var(--safe-bg)}.vhero.warn{background:var(--warn-bg)}.vhero.risk{background:var(--risk-bg)}
.vhero .m{width:64px;height:64px;flex:none}
.vhero h2{font-size:21px}
.vhero p{margin:2px 0 0;font-size:13px;color:var(--ink2)}
.vhero .vk{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em}
.vhero.safe .vk{color:var(--safe)}.vhero.warn .vk{color:var(--warn)}.vhero.risk .vk{color:var(--risk)}
.sec{margin-top:16px}
.sec h4{margin:0 0 8px;font-size:13px;color:var(--ink2)}

/* 스캔 */
.modes{margin-bottom:12px}
.fcat{margin-bottom:14px}
.fcat h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600}
.tray{position:sticky;bottom:72px;z-index:5;margin-top:10px;background:var(--ink);color:#fff;border-radius:20px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(26,32,80,.25)}
.tray div{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray div small{display:block;color:#A9B0DA;font-size:11px}
.tray .btn{height:40px}
.stage{position:relative;border-radius:24px;overflow:hidden;background:#0E1236;aspect-ratio:3/4;max-height:62vh;width:100%}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage .bg{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 30%,#2A3478,#0E1236)}
.stage .bg::before{content:'';position:absolute;left:18%;right:18%;top:26%;bottom:38%;border-radius:18px;background:linear-gradient(160deg,#3B4597,#232B6A);box-shadow:0 30px 50px rgba(0,0,0,.35)}
.stage .bg::after{content:'';position:absolute;left:30%;right:30%;top:48%;height:9%;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 4px,#fff 4px 5px,transparent 5px 8px);opacity:.75;border-radius:2px}
.vf{position:absolute;left:12%;right:12%;top:36%;height:22%;}
.vf i{position:absolute;width:26px;height:26px;border:3px solid #fff;border-radius:4px}
.vf i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.vf i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}.vf i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.vf i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.vf .ln{position:absolute;left:6%;right:6%;top:50%;height:2px;background:#FF5E62;box-shadow:0 0 12px #FF5E62;animation:scanl 1.8s ease-in-out infinite}
@keyframes scanl{0%,100%{transform:translateY(-30px)}50%{transform:translateY(30px)}}
.stage .tl{position:absolute;left:14px;top:14px;color:#fff;font-size:12px;display:flex;flex-direction:column;gap:2px}
.stage .tl b{font-family:var(--mono);font-weight:500;letter-spacing:.14em;font-size:11px;display:flex;align-items:center;gap:6px}
.stage .tl b i{width:7px;height:7px;border-radius:50%;background:#FF5E62;animation:blink 1.2s infinite}
.stage .tl span{opacity:.75}
.stage .shut{position:absolute;left:0;right:0;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;font-size:12px;text-align:center;padding:0 20px}
.stage .shut button{width:64px;height:64px;border-radius:50%;border:4px solid rgba(255,255,255,.85);background:rgba(255,255,255,.18);display:grid;place-items:center}
.stage .shut button span{width:46px;height:46px;border-radius:50%;background:#fff}
.stage .shut p{margin:0;opacity:.85}
.ar-tag{position:absolute;left:50%;top:13%;transform:translateX(-50%);width:min(86%,330px);background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-radius:20px;padding:12px 14px 6px;box-shadow:0 18px 40px rgba(0,0,0,.35);animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:translate(-50%,10px) scale(.9);opacity:0}}
.ar-tag::after{content:'';position:absolute;left:50%;bottom:-9px;width:18px;height:18px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:3px}
.ar-tag .hd{display:flex;align-items:center;gap:8px}
.ar-tag .hd b{font-size:14px;flex:1}
.ar-tag .gcurve{margin-top:2px}
.prods{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px}
.prods::-webkit-scrollbar{display:none}
.prods button{flex:none;height:36px;padding:0 12px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);font-size:12.5px}

/* 시뮬레이터 */
.plate{display:grid;gap:6px}
.pitem{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:14px;background:var(--soft)}
.pitem b{flex:1;font-size:13.5px;min-width:0}
.pitem b small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.step{display:flex;align-items:center;background:var(--bg);border-radius:10px;border:1px solid var(--line2)}
.step button{width:30px;height:30px;border:none;background:none;font-size:16px;color:var(--pri)}
.step span{min-width:30px;text-align:center;font-family:var(--mono);font-size:12.5px}
.pitem .del{width:28px;height:28px;border:none;background:none;color:var(--dim);font-size:18px}
.lev{display:grid;gap:12px}
.lev .lr>span{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.lev .lr>span em{font-style:normal;color:var(--pri);font-family:var(--mono)}
input[type=range]{width:100%;accent-color:var(--pri);height:28px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);width:100%;text-align:left;font-size:13.5px}
.tg small{display:block;color:var(--muted);font-size:11.5px}
.sw{width:42px;height:25px;border-radius:999px;background:var(--line2);position:relative;flex:none;transition:.2s}
.sw i{position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
[aria-checked="true"] .sw,.sw[aria-checked="true"]{background:var(--pri)}
[aria-checked="true"] .sw i,.sw[aria-checked="true"] i{left:20px}
.delta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.delta div{border-radius:14px;padding:9px 10px;background:var(--soft)}
.delta span{display:block;font-size:11px;color:var(--muted)}
.delta b{font-family:var(--mono);font-size:17px;font-weight:500}
.delta b.good{color:var(--safe)}
.acts{display:grid;gap:6px}
.act{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--bg)}
.act div{flex:1;min-width:0}
.act div b{font-size:13.5px;display:block}
.act div small{font-size:11.5px;color:var(--muted)}
.act .d{font-family:var(--mono);font-size:14px;color:var(--safe);font-weight:500;white-space:nowrap}
.act[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-bg)}
.act .on{height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line2);background:var(--bg);font-size:12px;font-weight:600}
.act[aria-pressed="true"] .on{background:var(--pri);color:#fff;border-color:var(--pri)}
.goal{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;margin-top:10px;font-size:13px}
.goal.safe{background:var(--safe-bg)}.goal.warn{background:var(--warn-bg)}.goal.risk{background:var(--risk-bg)}
.goal b{display:block;font-size:14px}
.caution{display:flex;gap:10px;padding:12px 14px;border-radius:16px;background:var(--warn-bg);font-size:12.5px;margin-top:10px;color:#7A4D08}
.caution b{display:block;font-size:13px;color:var(--warn)}

/* 기록 */
.gin{display:flex;gap:8px;align-items:stretch}
.gin input{font-family:var(--mono);font-size:22px;height:54px;text-align:center}
.gin .btn{height:54px;white-space:nowrap;flex:none;min-width:76px}
.learn{height:8px;border-radius:9px;background:var(--soft);overflow:hidden;margin:8px 0 4px}
.learn i{display:block;height:100%;background:var(--pri);border-radius:9px}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:52px 1fr 48px;gap:8px;align-items:center;font-size:12.5px}
.bar .tr{height:10px;border-radius:6px;background:var(--soft);position:relative;overflow:hidden}
.bar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--pri)}
.bar .tr i.hi{background:var(--warn)}
.bar b{font-family:var(--mono);font-weight:500;text-align:right}
.lrow{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:none}
.lrow div{flex:1;min-width:0}
.lrow div b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow div span{font-size:11.5px;color:var(--muted)}
.lrow .v{font-family:var(--mono);font-size:15px;text-align:right}
.lrow .v small{display:block;font-size:10.5px;color:var(--muted);font-family:var(--sans)}
.pend{display:grid;grid-template-columns:1fr 90px auto;gap:6px;align-items:center;margin-top:8px}
.pend input{height:40px;font-family:var(--mono);text-align:center;font-size:16px}
.pend .btn{height:40px}
.dayc{width:100%;height:auto;display:block}
.dayc .band{fill:var(--safe-bg)}
.dayc .gl{stroke:var(--line)}
.dayc .gt{font-size:10px;fill:var(--muted);font-family:var(--mono)}
.dayc circle{stroke:#fff;stroke-width:2}

/* SOS */
.sos-top{background:var(--risk);color:#fff;border-radius:24px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.sos-top h1{font-size:22px;line-height:1.3}
.sos-top p{margin:6px 0 0;font-size:13px;opacity:.9}
.sos-top .k{color:#FFD5D3}
.sos-top .m{position:absolute;right:10px;top:10px;width:64px;height:64px}
.sym{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sym span{font-size:12px;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px}
.carbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.carbs div{border-radius:14px;background:var(--soft);padding:10px 12px;font-size:13px}
.carbs div b{display:block;font-size:13.5px}
.carbs div span{color:var(--muted);font-size:11.5px}
.timer{display:flex;align-items:center;gap:16px}
.ring{width:110px;height:110px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--soft)}
.ring .fgc{stroke:var(--pri);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:24px;font-weight:500}
.call{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:18px;background:var(--ink);color:#fff;text-decoration:none;margin-bottom:12px}
.call b{font-size:26px;font-family:var(--mono);font-weight:500;margin-left:auto}
.call div span{display:block;font-size:12px;opacity:.75}
.map{position:relative;height:300px;border-radius:18px;overflow:hidden;background:var(--soft);margin:0 -2px}
.map .km{position:absolute;inset:0}
.km-pin{display:flex;align-items:center;gap:5px;height:30px;padding:0 9px 0 6px;border-radius:999px;border:2px solid #fff;background:var(--pri);color:#fff;font-size:11.5px;font-weight:700;box-shadow:0 4px 10px rgba(0,0,0,.25);white-space:nowrap;font-family:var(--sans);cursor:pointer;transform:translateY(-6px)}
.km-pin i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-style:normal;font-size:10px}
.km-pin.cs{background:#E39A22}.km-pin.er{background:var(--risk)}
.km-pin.on{transform:translateY(-6px) scale(1.12);z-index:3}
.km-pin:not(.on) b{display:none}
.km-me{width:20px;height:20px;border-radius:50%;background:var(--pri);border:4px solid #fff;box-shadow:0 0 0 8px rgba(63,81,230,.2)}
.plc{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);width:100%;border-left:none;border-right:none;border-bottom:none;background:none;text-align:left}
.plc:first-child{border-top:none}
.plc .tp{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.plc .tp.cs{background:#E39A22}.plc .tp.rx{background:var(--pri)}.plc .tp.er{background:var(--risk)}
.plc div{flex:1;min-width:0}
.plc div b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plc div span{font-size:11.5px;color:var(--muted)}
.plc .d{font-family:var(--mono);font-size:13px;color:var(--ink2)}
.plc.on b{color:var(--pri)}
.rescue{border:2px solid var(--ink);border-radius:20px;padding:14px 16px}

/* 내 정보 */
.prof{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.prof .m{width:70px;height:70px}
.prof b{font-size:20px;display:block}
.prof span{font-size:13px;color:var(--muted)}
.optg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.optg button{min-height:46px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);font-size:13px;text-align:left;padding:8px 12px;line-height:1.35}
.optg button small{display:block;font-size:11px;color:var(--muted)}
.optg button[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-bg);color:var(--pri);font-weight:700;box-shadow:inset 0 0 0 1px var(--pri)}
.optg button[aria-pressed="true"] small{color:var(--pri2)}
.optg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}

/* 인트로 (TRACE 구조) */
#intro{position:fixed;inset:0;z-index:80;overflow-y:auto;-webkit-overflow-scrolling:touch;--gx:70%;--gy:20%;background:radial-gradient(560px circle at var(--gx) var(--gy),rgba(110,127,243,.14),rgba(201,208,252,.07) 45%,transparent 70%),radial-gradient(900px 520px at 85% 8%,rgba(201,208,252,.45),transparent 60%),radial-gradient(700px 420px at 0% 30%,rgba(238,240,254,.9),transparent 60%),#fff;background-attachment:fixed}
body.intro-open{overflow:hidden}
.in-top{position:sticky;top:0;z-index:3;background:rgba(255,255,255,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px;padding:0 max(20px,calc((100% - 1192px) / 2))}
.in-top .wm .m{width:30px;height:30px}
.in-hero{position:relative;max-width:1240px;margin:0 auto;padding:56px 24px 88px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:56px;align-items:center}
.in-hero>*:not(.wf){position:relative;z-index:1}
canvas.wf{position:absolute;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none}
.in-k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--pri);margin:0 0 14px;text-transform:uppercase}
.in-hero h1{font-size:clamp(32px,4.4vw,54px);line-height:1.2;letter-spacing:-.045em}
.in-hero h1 em{font-style:normal;color:var(--pri)}
.in-sub{font-size:16px;color:var(--ink2);max-width:46ch;margin:20px 0 28px;line-height:1.7}
.in-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn.lg{height:52px;padding:0 24px;font-size:15px;border-radius:16px}
.in-stats{display:flex;gap:36px;margin-top:40px}
.in-stats b{display:block;font-size:30px;font-weight:500;line-height:1.2;color:var(--pri)}
.in-stats span{font-size:12px;color:var(--muted)}
.phone{justify-self:center;width:300px;height:580px;border:1.5px solid var(--line2);border-radius:42px;padding:11px;background:#fff;box-shadow:0 30px 80px rgba(63,81,230,.14)}
.ph-in{position:relative;height:100%;border-radius:32px;background:var(--page);overflow:hidden}
.ph-top{display:flex;justify-content:space-between;padding:24px 20px 12px;font-size:10px;letter-spacing:.1em}
.blink{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--risk);margin-right:6px;vertical-align:1px;animation:blink 1s steps(2) infinite}
.ph-card{margin:0 12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}
.ph-h{display:flex;justify-content:space-between;align-items:center}.ph-h b{font-size:15px}
.ph-n{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}.ph-n div{background:var(--soft);border-radius:10px;padding:6px 7px}.ph-n span{display:block;font-size:9.5px;color:var(--muted)}.ph-n b{font-size:14px;font-weight:500}
.dc{width:100%;height:auto;display:block;margin-top:6px;overflow:visible}
.dc .band{fill:var(--safe-bg)}.dc .lim{stroke:#BFE5CD;stroke-dasharray:3 3}
.dc .p0{fill:none;stroke:#B3B8CF;stroke-width:2;stroke-dasharray:4 4}
.dc .p1{fill:none;stroke:var(--pri);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.dc .draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 8s infinite}
.dc .pk{fill:#fff;stroke:var(--pri);stroke-width:2.5;opacity:0;animation:pkin 8s infinite}
.dc .pt{font:500 11px var(--mono);fill:var(--pri);opacity:0;animation:pkin 8s infinite}
@keyframes draw{0%{stroke-dashoffset:600;opacity:1}35%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes pkin{0%,30%{opacity:0}36%,90%{opacity:1}100%{opacity:0}}
.ph-res{position:absolute;left:12px;right:12px;bottom:12px;background:#fff;border:1px solid var(--line);border-top:3px solid var(--safe);border-radius:16px;padding:14px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center;transform:translateY(130%);animation:res 8s infinite;box-shadow:0 10px 24px rgba(26,32,80,.08)}
.ph-res .m{width:52px;height:52px}.ph-res b{display:block;font-size:16px;color:var(--safe);margin:2px 0 6px}
.tg2{display:flex;flex-wrap:wrap;gap:4px}.tg2 span{font-size:10.5px;background:var(--pri-bg);color:var(--pri);border-radius:999px;padding:2px 8px;font-weight:600}
@keyframes res{0%,44%{transform:translateY(130%)}50%,86%{transform:none}92%,100%{transform:translateY(130%)}}
.in-steps{max-width:1240px;margin:0 auto;padding:60px 24px}
.in-steps h2{font-size:clamp(24px,3vw,34px);margin-bottom:36px}
.in-row{display:grid;grid-template-columns:120px minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:center;padding:28px 0;border-top:1px solid rgba(214,218,234,.8)}
.in-row:last-child{border-bottom:1px solid rgba(214,218,234,.8)}
.in-n{display:flex;flex-direction:column;gap:2px}.in-n span:first-child{font-size:30px;font-weight:500;color:var(--pri)}.in-n .k{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.in-t h3{font-size:22px;margin-bottom:8px}.in-t p{margin:0;color:var(--ink2);font-size:15px;max-width:40ch;line-height:1.7}
.in-v{height:180px;background:rgba(238,240,254,.75);border-radius:18px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.v-bar{position:relative;display:flex;gap:6px;height:80px;padding:10px 24px;background:#fff;border-radius:8px;box-shadow:0 6px 20px rgba(63,81,230,.08)}
.v-bar i{width:5px;background:var(--ink)}.v-bar i:nth-child(2n){width:2px}.v-bar i:nth-child(3n){width:8px}
.scanl{position:absolute;left:0;right:0;top:0;height:2px;background:var(--risk);box-shadow:0 0 12px var(--risk);animation:scanl 2.6s infinite}
@keyframes scanl{0%{top:0;opacity:1}42%{top:100%;opacity:1}46%,100%{top:100%;opacity:0}}
.v-tag{position:absolute;left:50%;top:-30px;transform:translateX(-50%);white-space:nowrap;background:var(--pri);color:#fff;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;animation:tagin 2.6s infinite}
@keyframes tagin{0%,40%{opacity:0;transform:translate(-50%,6px)}50%,92%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.v-c{width:min(280px,86%);background:#fff;border-radius:14px;padding:8px 12px 10px;box-shadow:0 6px 20px rgba(63,81,230,.08)}
.v-chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.v-chips span{font-size:11px;background:var(--safe-bg);color:var(--safe);border-radius:999px;padding:3px 9px;font-weight:700}
.v-chips.col{flex-direction:column;align-items:flex-start}.v-chips.col span{background:#fff;color:var(--ink);box-shadow:0 4px 12px rgba(63,81,230,.08)}
.v-bars{display:flex;flex-direction:column;gap:10px;width:min(260px,86%)}
.v-bars div{display:grid;grid-template-columns:34px 1fr 44px;gap:8px;align-items:center;font-size:12px}
.v-bars i{height:10px;border-radius:9px;background:#fff;position:relative;overflow:hidden}.v-bars i::after{content:'';position:absolute;inset:0;width:var(--w);background:var(--pri);border-radius:9px;transform-origin:left;transform:scaleX(0);transition:transform 1s .3s}
.in .v-bars i::after{transform:scaleX(1)}
.v-bars b{font-size:12px;font-weight:500;text-align:right}
.v-sos{display:flex;gap:18px;align-items:center}
.v-ring{width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--pri) 0 72%,#fff 72% 100%);display:grid;place-items:center;animation:spin 6s linear infinite}
.v-ring b{width:76px;height:76px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:17px;font-weight:500;animation:spin 6s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.v-game{display:flex;align-items:center;gap:10px}
.v-game svg .wave{transform-origin:87px 84px;animation:wv 1.6s ease-in-out infinite}
@keyframes wv{50%{transform:rotate(-24deg)}}
.v-cgm{background:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 6px 20px rgba(63,81,230,.1)}
.v-cgm span{font-size:9.5px;color:var(--pri);letter-spacing:.14em}.v-cgm b{display:block;font-size:28px;font-weight:500;color:var(--pri);line-height:1.1}.v-cgm em{font-style:normal;font-size:11px;color:var(--safe);font-weight:700}
.in-end{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:70px 24px 30px}
.in-end .m{width:120px;height:120px;animation:bob 3.2s ease-in-out infinite}
.in-end h2{font-size:clamp(26px,3vw,38px);line-height:1.3}
.in-end p{color:var(--muted);margin:0 0 10px;max-width:40ch}
.in-foot{text-align:center;font-size:12px;color:var(--muted);padding:12px 24px 40px;margin:0}
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
.ob-bar{flex:1;max-width:360px;display:flex;gap:4px}.ob-bar i{flex:1;height:3px;background:var(--line);border-radius:2px}.ob-bar i.on{background:var(--pri)}
.ob{max-width:640px;margin:0 auto;padding:48px 24px;display:flex;flex-direction:column;gap:26px}
.ob-q{display:flex;align-items:flex-end;gap:14px}
.ob-m{width:104px;height:104px;flex-shrink:0;animation:pop .45s both,bob 3.2s .45s ease-in-out infinite}
.bubble{background:#fff;border:1.5px solid var(--pri);border-radius:18px 18px 18px 4px;padding:14px 20px;font-size:21px;font-weight:700;line-height:1.4;margin-bottom:22px;animation:fu .4s .1s both;box-shadow:0 8px 24px rgba(63,81,230,.1)}
@keyframes fu{from{opacity:0;transform:translateY(8px)}}
.ob-in{width:100%;height:64px;border:none!important;border-bottom:2px solid var(--line2)!important;border-radius:0!important;font-size:26px;font-weight:700;padding:0 2px;background:transparent!important;box-shadow:none!important;transition:border-color .2s}
.ob-in:focus{outline:none;border-bottom-color:var(--pri)!important}
.ob-body{display:flex;flex-direction:column;gap:10px}
.ob-opts{display:flex;flex-direction:column;gap:8px}
.ob-opts button{text-align:left;padding:15px 18px;border:1px solid var(--line2);border-radius:16px;background:#fff;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.ob-opts button:hover{border-color:var(--pri)}
.ob-opts b{font-size:16px}.ob-opts span{font-size:13px;color:var(--muted)}
.ob-opts button[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:#fff}.ob-opts button[aria-pressed="true"] span{color:#DCE1FF}
.ob-next{display:flex;justify-content:flex-end}
.ob.done{align-items:center;text-align:center}
.ob-m.xl{width:160px;height:160px}
.ob.done h2{font-size:28px}
.ob-sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:440px}
.ob-sum div{border-radius:14px;background:rgba(238,240,254,.8);padding:12px 14px;text-align:left}.ob-sum .lbl{font-size:11px;color:var(--muted);display:block}.ob-sum b{display:block}
@media (max-width:860px){
  .in-hero{grid-template-columns:1fr;padding:32px 20px 48px;gap:40px}
  .phone{width:270px;height:520px}
  .in-stats{gap:22px}.in-stats b{font-size:24px}
  .in-steps{padding:40px 20px}
  .in-row{grid-template-columns:1fr;gap:12px}
  .in-n{flex-direction:row;align-items:baseline;gap:10px}
  .ob{padding:32px 20px}.ob-m{width:80px;height:80px}.bubble{font-size:17px}
}
/* 인터랙션 */
.btn,.chip,.seg button,.optg button,.prods button,.plc,.row,.tg,.act .on,.search .go{position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.2;transform:scale(0);animation:rp .6s ease-out forwards}
@keyframes rp{to{transform:scale(1);opacity:0}}
.squish{animation:squish .55s cubic-bezier(.3,1.6,.5,1)!important}
@keyframes squish{0%{transform:scale(1)}30%{transform:scale(1.18,.84)}60%{transform:scale(.94,1.07)}100%{transform:scale(1)}}
@keyframes pop{from{transform:scale(.85) translateY(8px);opacity:0}}
.pu{transition:transform .12s ease-out}
.hero,.game-card,.in-end{--gx:50%;--gy:30%}
.hero{overflow:hidden;border-radius:24px;margin:0 -8px;padding:8px 8px 4px}
.hero>*:not(.wf){position:relative;z-index:1}
.hero::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;opacity:0;transition:opacity .4s;border-radius:inherit;background:radial-gradient(420px circle at var(--gx) var(--gy),rgba(110,127,243,.16),rgba(201,208,252,.08) 40%,transparent 70%)}
.game-card::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(260px circle at var(--gx) var(--gy),rgba(255,255,255,.25),transparent 65%)}
.hero.glow::before,.game-card.glow::before{opacity:1}
.hero::before{-webkit-mask:radial-gradient(closest-side,#000 55%,transparent);mask:radial-gradient(closest-side,#000 55%,transparent)}
@media (prefers-reduced-motion:reduce){canvas.wf{display:none}}

/* 게임 오버레이 */
#gameBox{position:fixed;inset:0;z-index:95;background:#0E1236}
#gameBox iframe{width:100%;height:100%;border:0;display:block}
#gameBox .gx{position:absolute;right:12px;top:12px;z-index:2;height:36px;padding:0 14px;border-radius:12px;border:none;background:rgba(255,255,255,.92);color:var(--ink);font-weight:700;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.2)}

.rei .ey{animation:blinke 5s infinite;transform-origin:center 62px;transform-box:fill-box}
@keyframes blinke{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== 글자 정리: 단어 단위 줄바꿈, 균형 잡힌 줄, 자간·행간 ===== */
body{letter-spacing:-.015em;line-height:1.6;word-break:keep-all;overflow-wrap:break-word}
h1,h2,h3,h4{text-wrap:balance;line-height:1.3;letter-spacing:-.035em}
p,.note,.s,small{text-wrap:pretty}
.center,.empty,.in-end,.ob.done,.in-foot,.sf-n{text-align:center;text-wrap:balance}
.center *,.empty *,.in-end *,.ob.done *{text-wrap:balance}
.note.center{display:block}
.lead{margin:0 0 12px}
.in-hero h1{line-height:1.18;letter-spacing:-.045em}
.in-sub{letter-spacing:-.02em;line-height:1.75}
.in-t p,.in-end p{line-height:1.75}
.in-end p{max-width:none}
.in-row .in-t h3{letter-spacing:-.03em}
.card-h b,.row b{letter-spacing:-.025em}
.ph{display:none}
.tray-card,.tip{display:none}
.tip p{margin:6px 0 0;font-size:14px;line-height:1.65;color:var(--ink2)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.wd .wb{width:100%;height:80px;border-radius:10px;background:var(--soft);display:flex;align-items:flex-end;overflow:hidden}
.wd .wb i{display:block;width:100%;border-radius:10px;background:var(--dim)}
.wd .wb i.ok{background:var(--pri)}.wd .wb i.lo{background:var(--warn)}
.wd b{font-size:12.5px;color:var(--ink);font-weight:500}
.wd.now span:last-child{color:var(--pri);font-weight:700}
.tg small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}

/* ===== 웹사이트 레이아웃 (960px 이상) ===== */
html.web{--w:1180px}
html.web body{background:radial-gradient(900px 420px at 90% -80px,rgba(201,208,252,.5),transparent 70%),radial-gradient(700px 360px at -10% 0,rgba(238,240,254,.9),transparent 70%),var(--page);background-attachment:fixed}
html.web header{background:rgba(255,255,255,.82)}
html.web .hb{height:68px;padding:0 32px;gap:32px}
html.web .hb .wm{gap:10px}html.web .hb .wm .m{width:34px;height:34px}html.web .hb .wm b{font-size:20px}html.web .hb .wm small{font-size:12px;margin-left:2px}
html.web nav.tabs{display:flex;height:100%;gap:2px;margin-left:8px}
html.web nav.tabs button{height:100%;padding:0 16px;border:none;background:none;font-size:14.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;letter-spacing:-.02em}
html.web nav.tabs button:hover{color:var(--ink)}
html.web nav.tabs button[aria-current="page"]{color:var(--pri);border-bottom-color:var(--pri)}
html.web .ib[aria-current="page"]{background:var(--pri-bg);color:var(--pri)}
html.web .sos{height:38px;padding:0 16px;font-size:13px;letter-spacing:0}
html.web .dock{display:none}
html.web main{padding:36px 32px 0}
html.web .toast{bottom:32px}
html.web .ph{display:block;margin:0 0 24px}
html.web .ph .k{display:block;margin-bottom:6px}
html.web .ph h1{font-size:34px;letter-spacing:-.04em}
html.web .ph p{margin:8px 0 0;color:var(--ink2);font-size:15.5px;max-width:58ch;line-height:1.7}
html.web .mob{display:none}
html.web .lay{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
html.web .lay.stick .lb{position:sticky;top:92px}
html.web .card,html.web .pred,html.web .row,html.web .game-card{margin-bottom:16px}
html.web .card{padding:20px 22px;border-radius:22px}
html.web .tray{display:none}
html.web .tray-card,html.web .tip{display:block}
html.web .modes{max-width:460px;margin-bottom:20px}
html.web .stage{aspect-ratio:4/3;max-height:none}
html.web .prods{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
/* 홈 히어로: 넓게 */
html.web .hero{margin:0 0 24px;padding:44px 48px 36px;border-radius:28px;background:linear-gradient(135deg,#fff 0,#F3F5FE 100%);border:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) 180px;column-gap:32px}
html.web .hero .hero-t{display:contents}
html.web .hero .hero-t>div:first-child{grid-column:1}
html.web .hero .m{grid-column:2;grid-row:1 / span 3;width:170px;height:170px;align-self:center}
html.web .hero h1{font-size:44px;line-height:1.2;letter-spacing:-.045em}
html.web .hero .hk{font-size:15px}
html.web .hero .search{grid-column:1;max-width:620px;height:60px;margin:22px 0 12px}
html.web .hero .chips{grid-column:1;flex-wrap:wrap;overflow:visible;margin:0;padding:0}
/* 시트 → 가운데 모달 */
html.web .sheet{top:50%;bottom:auto;transform:translate(-50%,-50%);max-width:560px;max-height:86vh;border-radius:26px;padding:20px 26px 26px;animation:upw .28s cubic-bezier(.2,.9,.3,1)}
html.web .sheet .grab{display:none}
@keyframes upw{from{transform:translate(-50%,-46%);opacity:0}}
/* 푸터 */
.site-foot{margin:48px -32px 0;padding:36px 32px 40px;border-top:1px solid var(--line);display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:24px;background:rgba(255,255,255,.6)}
.site-foot .wm .m{width:28px;height:28px}.site-foot .wm b{font-size:17px}
.site-foot p{margin:8px 0 0;color:var(--muted);font-size:13px}
.sf-c{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.sf-c b{font-size:13px;margin-bottom:4px}
.sf-c button{border:none;background:none;padding:0;color:var(--ink2);font-size:13.5px}
.sf-c button:hover{color:var(--pri)}
.sf-n{grid-column:1 / -1;margin:8px 0 0!important;font-size:12px!important;padding-top:16px;border-top:1px solid var(--line)}

.search input{flex:1;min-width:0;width:auto}
.chips>*{flex:none}
html.web .gcurve{max-height:280px}
html.web .sos-top .k{display:none}

/* ===== 글라스 테마: 은은한 블루 배경 위에 반투명 카드 ===== */
:root{--glass:rgba(255,255,255,.58);--glass2:rgba(255,255,255,.42);--gline:rgba(255,255,255,.75);--gshadow:0 10px 36px rgba(48,62,190,.08),0 1px 2px rgba(48,62,190,.05);--blur:blur(22px) saturate(170%)}
body{background:#F3F5FC}
body::before{content:'';position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:
  radial-gradient(38% 32% at 12% 8%,rgba(110,127,243,.28),transparent 70%),
  radial-gradient(34% 30% at 92% 18%,rgba(165,178,250,.38),transparent 70%),
  radial-gradient(40% 36% at 78% 88%,rgba(120,140,245,.22),transparent 70%),
  radial-gradient(32% 30% at 8% 78%,rgba(201,208,252,.5),transparent 70%);filter:blur(10px)}
html.web body{background:#F3F5FC}
.card,.pred,.row,.game-card .gimg,.tray-card,.prof,.vhero,.sw-hero,.swc,.myth details,.swsteps li,.sw-sec.src{backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.card,.pred,.row,.swc,.myth details,.swsteps li{background:var(--glass);border:1px solid var(--gline);box-shadow:var(--gshadow),inset 0 1px 0 rgba(255,255,255,.9)}
.row.alert{background:rgba(253,232,231,.62);border-color:rgba(255,255,255,.75)}
header{background:rgba(255,255,255,.55)!important;backdrop-filter:var(--blur)!important;-webkit-backdrop-filter:var(--blur)!important;box-shadow:0 1px 0 rgba(255,255,255,.7),0 6px 24px rgba(48,62,190,.05)}
.dock{background:rgba(255,255,255,.6);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-top:1px solid var(--gline)}
.nums div,.today div,.delta div,.carbs div,.pitem,.ph-n div{background:rgba(238,240,254,.55)}
.seg{background:rgba(232,235,250,.6)}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.95)}
.chip{background:rgba(255,255,255,.62);border-color:rgba(214,218,234,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn:not(.pri):not(.red):not(.dark):not(.soft){background:rgba(255,255,255,.66)}
input[type=text],input[type=number],input[type=tel],textarea{background:rgba(255,255,255,.72)}
.search{background:rgba(255,255,255,.75);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.game-card{background:linear-gradient(135deg,rgba(84,102,240,.95),rgba(63,81,230,.92));box-shadow:0 16px 40px rgba(63,81,230,.28),inset 0 1px 0 rgba(255,255,255,.35)}
html.web .hero{background:rgba(255,255,255,.5);border:1px solid var(--gline);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--gshadow),inset 0 1px 0 #fff}
.sheet{background:rgba(255,255,255,.86);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.sheet-bg{background:rgba(26,32,80,.22);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.site-foot{background:rgba(255,255,255,.4);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-top:1px solid var(--gline)}
.toast{background:rgba(26,32,80,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

/* ===== 대체당 ===== */
.sw-hero{position:relative;overflow:hidden;border-radius:26px;padding:24px 22px;margin-bottom:16px;color:#fff;background:linear-gradient(135deg,rgba(80,98,240,.94),rgba(52,68,205,.94));box-shadow:0 18px 44px rgba(63,81,230,.25),inset 0 1px 0 rgba(255,255,255,.35)}
.sw-hero::after{content:'';position:absolute;right:-80px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
.sw-hero .k{color:#C9D0FC}
.sw-hero h2{font-size:24px;margin:6px 0 8px;line-height:1.3}
.sw-hero p{margin:0;font-size:14px;line-height:1.7;color:#E2E6FF;max-width:52ch}
.sw-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px;position:relative;z-index:1}
.sw-facts div{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sw-facts b{display:block;font-size:22px;font-weight:500}
.sw-facts span{font-size:11.5px;color:#DCE1FF;line-height:1.45;display:block;margin-top:2px}
.sw4{grid-template-columns:repeat(4,minmax(0,1fr))!important}
.sw-res .vhero{margin-bottom:10px}
.swfound{display:flex;flex-wrap:wrap;gap:6px}
.swf{display:flex;flex-direction:column;align-items:flex-start;padding:8px 12px;border-radius:14px;border:1px solid var(--gline);background:rgba(255,255,255,.7);text-align:left}
.swf b{font-size:13px}.swf span{font-size:11px;color:var(--muted)}
.swf.safe{box-shadow:inset 3px 0 0 var(--safe)}.swf.warn{box-shadow:inset 3px 0 0 var(--warn)}.swf.risk{box-shadow:inset 3px 0 0 var(--risk)}
.swwarn{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.swwarn li{padding:10px 12px 10px 34px;border-radius:14px;font-size:13px;line-height:1.55;position:relative;background:rgba(238,240,254,.6)}
.swwarn li::before{content:'i';position:absolute;left:11px;top:11px;width:16px;height:16px;border-radius:50%;font:700 10px/16px var(--sans);text-align:center;color:#fff;background:var(--pri)}
.swwarn li.warn{background:rgba(253,240,218,.75)}.swwarn li.warn::before{content:'!';background:var(--warn)}
.swwarn li.risk{background:rgba(253,232,231,.8)}.swwarn li.risk::before{content:'!';background:var(--risk)}
.sw-sec{margin-top:28px}
.sw-sh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.sw-sh h2{font-size:22px;margin-top:4px}
.sw-sh .seg{flex:0 1 auto;overflow-x:auto;scrollbar-width:none;max-width:100%}
.sw-sh .seg button{flex:none;padding:0 12px}
.swgrid{display:grid;grid-template-columns:1fr;gap:12px}
.swc{border-radius:22px;padding:18px;transition:transform .2s,box-shadow .3s}
.swc.flash{box-shadow:0 0 0 3px var(--pri),var(--gshadow)}
.swc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.swc-h h3{font-size:18px;margin-top:2px}
.swc-n{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 10px}
.swc-n div{background:rgba(238,240,254,.6);border-radius:12px;padding:8px 10px}
.swc-n span{display:block;font-size:10.5px;color:var(--muted)}
.swc-n b{display:block;font-size:15px;font-weight:500;line-height:1.3}
.swc-n small{font-size:10px;color:var(--dim)}
.swc p{margin:0;font-size:13.5px;line-height:1.65;color:var(--ink2)}
.swc .adi{margin-top:6px;font-size:12.5px;color:var(--muted)}
.swc ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.swc li{font-size:12.5px;line-height:1.55;color:var(--ink2);padding-left:14px;position:relative}
.swc li::before{content:'';position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--pri2)}
.myth{display:grid;gap:8px}
.myth details{border-radius:18px;padding:0 18px}
.myth summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0;cursor:pointer}
.myth summary::-webkit-details-marker{display:none}
.myth summary b{font-size:15px;letter-spacing:-.025em}
.myth details p{margin:0 0 16px;font-size:13.5px;line-height:1.7;color:var(--ink2)}
.swsteps{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:s}
.swsteps li{counter-increment:s;border-radius:18px;padding:14px 16px 14px 56px;position:relative}
.swsteps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:16px;top:14px;font:500 18px var(--mono);color:var(--pri)}
.swsteps b{display:block;font-size:14.5px}.swsteps span{display:block;font-size:13px;color:var(--ink2);line-height:1.6;margin-top:2px}
.sw-sec.src{background:rgba(255,255,255,.4);border:1px solid var(--gline);border-radius:20px;padding:16px 18px}
.sw-sec.src p{margin:6px 0 0;font-size:12.5px;line-height:1.7;color:var(--ink2)}
html.web .sw-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:center;padding:40px 44px;border-radius:30px;margin-bottom:24px}
html.web .sw-hero h2{font-size:32px}
html.web .sw-facts{margin:0}
html.web .swgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
html.web .sw-sec{margin-top:44px}
html.web .sw-sh h2{font-size:28px}
html.web .myth{grid-template-columns:1fr 1fr;align-items:start}
html.web .swsteps{grid-template-columns:repeat(5,minmax(0,1fr))}
html.web .swsteps li{padding:52px 16px 18px}
html.web .swsteps li::before{top:16px}
@media (max-width:480px){.sw-facts b{font-size:18px}.sw-facts span{font-size:10.5px}.sw4 b{font-size:15px!important}}
@media (max-width:600px){.sw-facts span br{display:none}.sw-facts{gap:6px}.sw-facts div{padding:10px}}

/* ===== 배경은 화이트로: 카드는 얇은 선과 은은한 그림자로만 구분 ===== */
body,html.web body{background:#FFFFFF}
body::before{display:none}
.card,.pred,.row,.swc,.myth details,.swsteps li{background:#FFFFFF;border:1px solid #ECEEF6;box-shadow:0 4px 18px rgba(48,62,190,.05);backdrop-filter:none;-webkit-backdrop-filter:none}
.row.alert{background:#FFF5F5;border-color:#F9D9D8}
html.web .hero{background:linear-gradient(135deg,#FFFFFF 0,#F4F6FF 100%);border:1px solid #ECEEF6;box-shadow:0 4px 18px rgba(48,62,190,.05);backdrop-filter:none}
header{background:rgba(255,255,255,.88)!important;box-shadow:0 1px 0 #EEF0F6!important}
.dock{background:rgba(255,255,255,.94)}
.sw-sec.src,.site-foot{background:#FAFBFE;border-color:#ECEEF6}
.chip{background:#fff}

/* ===== 식단 ===== */
.pdays{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}.pdays::-webkit-scrollbar{display:none}
.pdays button{flex:none;height:32px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:#fff;font-size:12.5px;font-weight:600;color:var(--muted)}
.pdays button[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:#fff}
.pmeal{padding:14px 0;border-top:1px solid var(--line)}
.pmeal:first-of-type{border-top:none}
.pm-h{display:flex;align-items:center;gap:6px}
.pm-s{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--pri);font-weight:500;margin-right:auto}
.pm-n{display:block;font-size:15.5px;margin:6px 0 2px;line-height:1.5}.pm-n small{color:var(--muted);font-weight:500}
.pm-c .gcurve{margin-top:2px}
.pm-m{margin:4px 0 0;font-size:12.5px;color:var(--ink2)}
.pm-a{display:flex;gap:4px;margin-top:4px}.pm-a .link{font-size:12.5px;padding:4px 6px 4px 0}
.shop{display:flex;flex-wrap:wrap;gap:6px}.shop span{font-size:12.5px;padding:6px 10px;border-radius:10px;background:var(--soft);color:var(--muted)}.shop b{color:var(--ink);font-weight:600}

/* 미리 타운 배너 */
.gbanner{position:relative;display:block;width:100%;aspect-ratio:1600/600;min-height:260px;max-height:460px;border:none;border-radius:24px;overflow:hidden;padding:0;margin-bottom:20px;background:#3F51E6;text-align:left;color:#fff;cursor:pointer;box-shadow:0 18px 44px rgba(40,52,170,.22);isolation:isolate}
.gbanner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:66% 55%;z-index:-2;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.gbanner::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(34,44,160,.95) 0%,rgba(52,68,214,.82) 28%,rgba(63,81,230,.3) 46%,rgba(63,81,230,0) 60%)}
.gbanner:hover img{transform:scale(1.035)}
.gb-t{position:absolute;left:0;top:0;bottom:0;width:min(46%,480px);display:flex;flex-direction:column;justify-content:center;gap:10px;padding:28px 30px}
.gb-t .k{color:#C9D0FC;font-size:11px}
.gb-t b{font-size:clamp(26px,3.2vw,40px);letter-spacing:-.03em;line-height:1.15}
.gb-t>span{font-size:13.5px;line-height:1.65;opacity:.92;word-break:keep-all}
.gb-go{align-self:flex-start;margin-top:6px;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 20px;border-radius:14px;background:#fff;color:var(--pri);font-style:normal;font-weight:700;font-size:15px;box-shadow:0 8px 20px rgba(20,26,69,.18);transition:transform .2s}
.gbanner:hover .gb-go{transform:translateX(3px)}
.gb-tags{position:absolute;right:14px;bottom:12px;display:flex;gap:6px;font-style:normal}
.gb-tags u{text-decoration:none;font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.88);color:var(--ink);backdrop-filter:blur(6px)}
@media (max-width:700px){
  .gbanner{aspect-ratio:auto;min-height:0;height:auto;display:flex;flex-direction:column}
  .gbanner img{position:relative;inset:auto;height:230px;object-position:63% 92%}

<body>
<header><div class="hb"></div></header>
<main id="app"></main>
<nav class="dock" id="dock" aria-label="하단 메뉴"></nav>
<div id="intro" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ===== 카카오 지도 키: 카카오 개발자 사이트의 'JavaScript 키'를 따옴표 안에 붙여 넣으세요 ===== */
const KAKAO_KEY = '4e7d756d9270a153b0aeef38c9337fd2';

/* ================= 상태 ================= */
let S = {name:'', type:'t2', med:'none', fam:'', famName:'', snd:true, lg:false, onboarded:false, meals:[], glu:[], daily:{}, sens:1, slotK:{}, kakaoKey:'', town:null, shape:'drop', tint:'blue', acc:'none'};
try { const raw = localStorage.getItem('dangmiri-v1'); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
S.shape = 'drop'; S.tint = 'blue';
function save(){ try { localStorage.setItem('dangmiri-v1', JSON.stringify(S)); } catch (e) {} }
const ui = {view:'home', q:'', mode:'menu', pick:[], sheet:null, label:'', cam:false, camErr:false, hit:null, sim:null, gtag:'식전', ob:{stage: S.onboarded ? null : 'land', step: 0}, sos:{end: 0, done: false}, game:false};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function jo(w, a, b){ const c = String(w).charCodeAt(String(w).length - 1); if (c < 0xAC00 || c > 0xD7A3) return b; return (c - 0xAC00) % 28 ? a : b; }
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2200); }
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const todayK = () => ymd(new Date());
const hhmm = ts => { const d = new Date(ts); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const mdhm = ts => { const d = new Date(ts); return `${d.getMonth() + 1}.${d.getDate()} ${hhmm(ts)}`; };
const SLOTN = {b:'아침', l:'점심', d:'저녁', n:'야식'};
const slotOf = (ts = Date.now()) => { const h = new Date(ts).getHours(); return h < 5 ? 'n' : h < 10.5 ? 'b' : h < 15 ? 'l' : h < 21 ? 'd' : 'n'; };
const MEDS = {none:['없음','식단·운동 관리'], met:['메트포르민','저혈당 위험 낮음'], su:['설포닐우레아','글리메피리드 등 · 저혈당 주의'], ins:['인슐린','저혈당 주의']};
const hypoRisk = () => S.med === 'su' || S.med === 'ins' || S.type === 't1';
const hiOf = () => S.type === 'none' ? 140 : 180;
const nm = () => S.name ? S.name + '님' : '';

/* ================= 오늘 상태 → 예측 옵션 ================= */
function day(){ return S.daily[todayK()] || {}; }
function baseNow(){
  const r = S.glu.filter(g => Date.now() - g.ts < 100 * 60000 && (g.tag === '공복' || g.tag === '식전')).pop();
  return r ? r.v : null;
}
function ctx(extra = {}){
  const d = day(), slot = extra.time || slotOf();
  const sk = S.slotK[slot] || 1;
  return Object.assign({type: S.type, base: baseNow() || undefined, time: slot, sleep: d.sleep, stress: d.stress || 0, sens: S.sens * sk}, extra);
}
const foodName = it => it.name || it.n;
const itemsName = items => items.map(it => foodName(it) + (it.k && it.k !== 1 ? ` ×${it.k}` : '')).join(' + ');
function parseQuery(q){
  q = String(q || '').trim(); if (!q) return [];
  const one = findFood(q); if (one && one.replace(/\s/g, '').length >= q.replace(/\s/g, '').length - 1) return [{n: one, k: 1}];
  const out = [];
  q.split(/[,+·&/]|\s+(?:와|과|랑|하고|그리고)\s+|\s+/).forEach(w => { const f = findFood(w); if (f && !out.some(x => x.n === f)) out.push({n: f, k: 1}); });
  return out;
}

/* ================= 이렇게 하면 덜 올라요: 행동 후보 ================= */
const SWAP = {'흰쌀밥':'현미밥', '식빵 2장':'통밀빵 2장', '콜라':'제로 콜라', '바닐라 라떼':'아메리카노', '버블티':'아메리카노', '오렌지 주스':'사과', '베이글':'통밀빵 2장', '김치볶음밥':'비빔밥', '도넛':'그릭 요거트', '초코케이크':'그릭 요거트', '아이스크림':'그릭 요거트'};
function candidates(st){
  // st: {items, order, protein, walk}
  const C = [], items = st.items;
  if (!items.length) return C;
  if (st.order !== 'veg') C.push({id:'veg', t:'채소·반찬 먼저 먹기', s:'밥은 마지막에 · 5분이면 충분해요', e:1, ap: x => { x.order = 'veg'; }});
  if (!st.protein) C.push({id:'pro', t:'단백질 반찬 하나 추가', s:'달걀·두부·생선 한 접시', e:1, ap: x => { x.protein = true; }});
  if ((st.walk || 0) < 15) C.push({id:'walk', t:'식후 15분 걷기', s:'먹고 15분 뒤부터 · 설거지·장보기도 OK', e:2, ap: x => { x.walk = 15; }});
  items.forEach((it, i) => { const to = SWAP[it.n]; if (to && FOODS[to]) C.push({id:'sw' + i, t:`${it.n} → ${to}`, s:'바꿔 먹기', e:2, ap: x => { x.items = x.items.map((y, j) => j === i ? {n: to, k: y.k} : y); }}); });
  const carb = items.map((it, i) => ({i, c: (it.d || FOODS[it.n] || {c: 0}).c * (it.k || 1)})).sort((a, b) => b.c - a.c)[0];
  if (carb && carb.c > 30){ const it = items[carb.i]; C.push({id:'half', t:`${foodName(it)} ${it.k > 1 ? '1인분으로' : '2/3만'}`, s:`탄수화물 ${Math.round(carb.c / 3)}g 줄이기`, e:3, ap: x => { x.items = x.items.map((y, j) => j === carb.i ? Object.assign({}, y, {k: y.k > 1 ? 1 : Math.round(y.k * 2 / 3 * 100) / 100}) : y); }}); }
  return C;
}
const clone = st => ({items: st.items.map(x => Object.assign({}, x)), order: st.order || null, protein: !!st.protein, walk: st.walk || 0});
function runSt(st, o = {}){ return predict(st.items, ctx(Object.assign({order: st.order, protein: st.protein, walk: st.walk}, o))); }
function rankActs(st, o){
  const R0 = runSt(st, o);
  return candidates(st).map(c => { const x = clone(st); c.ap(x); const R = runSt(x, o); return Object.assign(c, {d: R0.peak - R.peak, R}); }).filter(c => c.d >= 2).sort((a, b) => (b.d / b.e) - (a.d / a.e));
}
function planToGoal(st, o){
  // 목표 안에 들어오는 가장 쉬운 조합(최대 3단계)
  let cur = clone(st), steps = [], R = runSt(cur, o);
  for (let k = 0; k < 3 && R.peak > R.hi; k++){ const A = rankActs(cur, o); if (!A.length) break; const a = A[0]; a.ap(cur); steps.push(a); R = runSt(cur, o); }
  return {steps, R, ok: R.peak <= R.hi};
}

/* ================= 화면 조각 ================= */
const VWORD = {safe:'괜찮아요', warn:'조금 높아요', risk:'많이 올라요'};
function predCard(items, title){
  const R = predict(items, ctx()), v = verdictOf(R), A = rankActs({items}, {}).slice(0, 2);
  return `<section class="pred" aria-live="polite">
    <div class="pred-h"><div><span class="u">${SLOTN[slotOf()]} · ${esc(items.map(it => FOODS[it.n] ? FOODS[it.n].u : '').filter(Boolean).join(' / ') || '1회 제공량')}</span><h2>${esc(title || itemsName(items))}</h2>
      <div class="verdict ${v}">${stTag(v, VWORD[v])}<span class="vk">${VTEXT[v][0]}</span></div></div><div class="m">${mascot(v)}</div></div>
    ${curveSVG([{R, col: v === 'risk' ? '#E5484D' : '#3F51E6'}], {h: 190})}
    <div class="nums"><div class="hl"><span>예상 최고</span><b>${R.peak}<small>mg/dL</small></b></div><div><span>최고점까지</span><b>${R.tPeak}<small>분</small></b></div><div><span>탄수화물</span><b>${R.carbs}<small>g</small></b></div></div>
    ${A.length ? `<ul class="tips">${A.map((a, i) => `<li><i>${i + 1}</i>${esc(a.t)}<b>−${Math.round(a.d)}</b></li>`).join('')}</ul>` : ''}
    <div class="btns" style="margin-top:12px"><button class="btn soft" data-sim="${esc(JSON.stringify(items))}">시뮬레이터로 조정</button><button class="btn pri" data-eat="${esc(JSON.stringify(items))}">먹었어요 · 기록</button></div>
  </section>`;
}
function ctxLine(){ const d = day(), b = baseNow(); return `${b ? `식전 ${b}` : '식전 혈당 기본값'} · ${d.sleep ? `수면 ${d.sleep}시간` : '수면 미입력'} · 스트레스 ${['낮음', '보통', '높음'][d.stress || 0]}${S.sens !== 1 ? ` · 내 패턴 ×${S.sens.toFixed(2)}` : ''}`; }

/* ================= 웹 레이아웃 ================= */
const WEBQ = window.matchMedia ? matchMedia('(min-width: 960px)') : {matches: false};
let WEB = WEBQ.matches; document.documentElement.classList.toggle('web', WEB);
if (WEBQ.addEventListener) WEBQ.addEventListener('change', e => { WEB = e.matches; document.documentElement.classList.toggle('web', WEB); render(); });
const PH = {
  scan: ['SCAN', '스캔', '먹을 메뉴를 고르거나 상품 바코드를 비추면 먹은 뒤 3시간 동안의 예상 곡선을 보여줘요.'],
  sim: ['SIMULATE', '다음 한 끼 시뮬레이터', '순서, 양, 바꿔 먹기, 식후 걷기 중 무엇이 가장 쉽게 효과가 큰지 비교해요.'],
  log: ['LOG · PATTERN', '기록과 나만의 패턴', '혈당과 식사를 남기면 예상과 실제의 차이로 내 몸에 맞는 예측을 배워요.'],
  sos: ['HYPO SOS', '저혈당 SOS', '당 15g, 15분 타이머, 가족 알림, 가까운 편의점을 한 화면에서 열어요.'],
  me: ['SETTINGS', '내 정보', '유형과 약, 보호자 연락처가 예측과 저혈당 안내의 기준이 돼요.'],
  town: ['MINI GAME', '미리 타운', '작은 동네에서 하루를 살며 혈당을 지켜 보는 3D 생활 게임이에요.'],
  plan: ['MEAL PLAN', '식단 짜기', '끼니마다 예상 곡선을 미리 계산해서, 목표 범위 안에 들어오는 조합으로 하루·일주일 식단을 짜 줘요.'],
  sweet: ['SWEETENER', '대체당 분석', '제로 제품에 든 대체당을 찾아서, 실제로 혈당에 얼마나 반영되는지와 주의할 점을 알려줘요.']
};
const phead = v => `<div class="ph"><span class="k">${PH[v][0]}</span><h1>${PH[v][1]}</h1><p>${PH[v][2]}</p></div>`;
const lay = (A, B, cls = '') => `<div class="lay ${cls}"><div class="la">${A}</div><div class="lb">${B}</div></div>`;
const TIPS = ['밥을 마지막에 먹으면 같은 양이라도 꼭대기가 낮아져요.', '먹고 15분쯤 뒤에 10~15분 걷는 게 가장 효과가 커요.', '음료의 당은 흡수가 빨라요. 단 음료는 식사보다 먼저 확인하세요.', '잠이 6시간보다 적은 다음 날은 같은 음식에도 더 올라요.', '저혈당일 땐 초콜릿보다 주스나 포도당 캔디가 빨라요.', '흰쌀밥을 잡곡밥으로만 바꿔도 곡선이 완만해져요.', '식후 혈당은 2시간 뒤에 재면 예측과 비교하기 좋아요.'];
const tipCard = () => `<section class="card tip"><span class="k">TODAY'S TIP</span><p>${TIPS[new Date().getDate() % TIPS.length]}</p></section>`;

/* ================= 홈 ================= */
const SUGG = ['김밥', '라면', '비빔밥', '떡볶이', '바닐라 라떼', '짜장면', '삼겹살 1인분', '베이글'];
function homeV(){
  const items = parseQuery(ui.q), d = day(), tg = S.glu.filter(g => ymd(new Date(g.ts)) === todayK()), last = S.glu[S.glu.length - 1];
  const tir = tg.length ? Math.round(tg.filter(g => g.v >= 70 && g.v <= hiOf()).length / tg.length * 100) : null;
  const pend = S.meals.filter(m => m.post == null && Date.now() - m.ts < 6 * 3600e3).pop();
  return `<section class="hero"><canvas class="wf" aria-hidden="true"></canvas><div class="hero-t"><div><p class="hk">${nm() ? nm() + ', ' : ''}${SLOTN[slotOf()]} 뭐 먹어요?</p><h1>한 입 먹기 전에<br><em>미리</em> 보여줄게요</h1></div><div class="m">${mascot(items.length ? verdictOf(predict(items, ctx())) : 'wave')}</div></div>
    <form class="search" data-form="ask"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--pri)" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><label class="sr" for="askq">먹을 음식</label><input id="askq" autocomplete="off" placeholder="먹을 음식 · 예: 김밥 라면" value="${esc(ui.q)}"><button class="go" type="submit">예측</button></form>
    <div class="chips">${SUGG.map(x => `<button class="chip" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div></section>
  <div class="lay"><div class="la">
  ${ui.q ? (items.length ? predCard(items) : `<section class="pred"><div class="empty"><div class="m">${mascot('think')}</div><b>‘${esc(ui.q)}’${jo(ui.q, '은', '는')} 아직 몰라요</b><p class="note">스캔에서 영양성분표를 붙여넣으면 바로 계산해요</p><button class="btn soft sm" data-go="scan" data-mode="label">영양성분표로 분석</button></div></section>`) : ''}
  ${pend ? `<button class="row" data-go="log"><span class="dot pri"></span><div><b>${esc(pend.name)} 먹고 ${Math.max(1, Math.round((Date.now() - pend.ts) / 60000))}분 지났어요</b><span class="s">식후 혈당을 넣으면 내 몸에 맞게 예측이 고쳐져요 · 예상 ${pend.pred.peak}</span></div><span class="chev">›</span></button>` : ''}
  <section class="card"><div class="card-h"><b>오늘 컨디션</b><span class="note">예측에 바로 반영돼요</span></div>
    <div class="cond"><span>잠</span><div class="seg">${[[5, '5시간 이하'], [6, '6시간'], [7, '7시간+']].map(([v, n]) => `<button aria-pressed="${d.sleep === v}" data-day="sleep:${v}">${n}</button>`).join('')}</div>
    <span>스트레스</span><div class="seg">${['낮음', '보통', '높음'].map((n, i) => `<button aria-pressed="${(d.stress || 0) === i && d.stress != null}" data-day="stress:${i}">${n}</button>`).join('')}</div></div></section>
  <section class="card"><div class="card-h"><b>오늘 혈당</b><button class="link" data-go="log">입력하기</button></div>
    <div class="today"><div><span>최근</span><b>${last ? last.v : '-'}${last ? '<small>' + hhmm(last.ts) + '</small>' : ''}</b></div><div><span>목표 범위 안</span><b>${tir == null ? '-' : tir}<small>${tir == null ? '' : '%'}</small></b></div><div><span>내 패턴</span><b>${S.sens === 1 ? '-' : '×' + S.sens.toFixed(1)}</b></div></div></section>
  </div><div class="lb">
  <button class="game-card" data-go="town"><span class="gimg">${townIcon()}</span><div><b>미리 타운</b><span>${S.town ? `최고 ${S.town.best || 0}점 · ${S.town.days || 0}일 생활` : '혈당을 지키며 하루를 사는 생활 게임'}</span></div><span class="play">입장</span></button>
  <button class="row" data-go="sim"><span class="ic">${icon('sim', 22)}</span><div><b>다음 한 끼 시뮬레이터</b><span class="s">순서 · 양 · 걷기 · 바꿔 먹기 중 가장 쉬운 방법 찾기</span></div><span class="chev">›</span></button>
  <button class="row" data-go="plan"><span class="ic">${icon('log', 22)}</span><div><b>식단 짜기</b><span class="s">목표 범위 안에 들어오는 하루·일주일 식단</span></div><span class="chev">›</span></button>
  <button class="row" data-go="sweet"><span class="ic">${icon('drop', 22)}</span><div><b>대체당 분석</b><span class="s">‘제로’ 제품 속 말티톨 · 말토덱스트린까지 확인</span></div><span class="chev">›</span></button>
  <button class="row alert" data-go="sos"><span class="ic">${icon('sos', 22)}</span><div><b>저혈당 SOS</b><span class="s">15-15 대처 · 가족 알림 · 가까운 편의점</span></div><span class="chev">›</span></button>
  ${tipCard()}
  <p class="note center" style="margin:18px 0 0">예측은 일반적인 식품 데이터와 내 기록으로 만든 참고값이에요. 약 조절은 꼭 의료진과 상의하세요.</p></div></div>`;
}
function townIcon(){ return `<svg width="44" height="44" viewBox="0 0 48 48" fill="none"><path d="M6 40V22l10-8 10 8v18z" fill="#fff" opacity=".95"/><path d="M26 40V16l8-6 8 6v24z" fill="#fff" opacity=".6"/><rect x="13" y="29" width="6" height="11" rx="1" fill="#3F51E6"/><circle cx="35" cy="22" r="2.4" fill="#3F51E6"/><path d="M2 40h44" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>`; }

/* ================= 스캔 ================= */
const SMODE = [['menu', '메뉴 고르기'], ['code', '바코드 AR'], ['label', '영양성분표']];
const LSAMPLE = '영양정보 총 내용량 90g\n탄수화물 58g 당류 28g 식이섬유 2g 단백질 6g 지방 22g';
function scanV(){
  const m = ui.mode;
  let A = '', B = '';
  if (m === 'menu'){
    const cats = {}; Object.keys(FOODS).forEach(k => { const c = FOODS[k].cat; if (c === 'fast') return; (cats[c] = cats[c] || []).push(k); });

const GTAG = ['공복', '식전', '식후 2시간', '자기 전'];
function learn(){
  // 식후 혈당을 넣은 식사로 내 몸 민감도(실제 상승 ÷ 예상 상승)를 배운다
  const done = S.meals.filter(m => m.post != null && m.raw && m.raw.rise > 8);
  const ratio = m => Math.max(.3, Math.min(3, (m.post - m.raw.base) / Math.max(m.raw.r2 || 0, m.raw.rise * .35)));
  const r = done.map(ratio);
  const med = a => { const s = a.slice().sort((x, y) => x - y), n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : 1; };
  // 기록이 적을 땐 평균 쪽으로 당겨서(축소 추정) 한두 번의 측정에 크게 흔들리지 않게
  S.sens = r.length >= 3 ? Math.round(Math.max(.6, Math.min(1.8, 1 + (med(r) - 1) * r.length / (r.length + 3))) * 100) / 100 : 1;
  S.slotK = {};
  Object.keys(SLOTN).forEach(k => { const rr = done.filter(m => m.slot === k).map(ratio); if (rr.length >= 2 && r.length >= 3) S.slotK[k] = Math.round(Math.max(.75, Math.min(1.35, med(rr) / S.sens)) * 100) / 100; });
  save();
  return {n: done.length, r};
}

  if (S.meals.length > 200) S.meals.shift(); save();
}

function dayChart(tg){
  const W = 360, H = 170, L = 30, T = 10, B = 22, R = 8, ymin = 40, ymax = Math.max(250, ...tg.map(g => g.v + 20)), hi = hiOf();

  [70, hi, 250].forEach(v => s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${L - 5}" y="${Y(v) + 4}" class="gt" text-anchor="end">${v}</text>`);
  [0, 6, 12, 18, 24].forEach(h => s += `<text x="${X(h)}" y="${H - 6}" class="gt" text-anchor="middle">${h}시</text>`);

  return s + '</svg>';
}

/* 미리 타운 멀티: 아티팩트의 room 기능을 게임(iframe)에 중계한다 */
const RM = {room: null, cur: null, un: null, ready: null};
function roomGet(){ if (!RM.ready) RM.ready = (window.claude && window.claude.use ? window.claude.use('room').catch(() => null) : Promise.resolve(null)).then(r => (RM.room = r)); return RM.ready; }
async function roomLeave(){ if (RM.un){ RM.un(); RM.un = null; } if (RM.cur){ try { if (RM.cur !== RM.room) await RM.cur.leave(); else await RM.cur.presence({p: null}); } catch (e) {} RM.cur = null; } }
addEventListener('message', async e => {
  const d = e.data || {}; if (d.type !== 'dm-net') return;
  const f = document.querySelector('#gameBox iframe'); if (!f || e.source !== f.contentWindow) return;
  const post = m => { try { f.contentWindow.postMessage(Object.assign({type: 'dm-net'}, m), '*'); } catch (err) {} };
  if (d.op === 'hello'){ const r = await roomGet(); post({op: 'hello', room: !!r}); }
  if (d.op === 'join'){
    const r = await roomGet(); if (!r){ post({op: 'error', msg: '이 화면에서는 공유 방을 쓸 수 없어요'}); return; }
    await roomLeave();
    try {
      const code = String(d.code || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 12), R = code === 'plaza' ? r : await r.join('town-' + code);
      RM.cur = R;
      RM.un = R.onPeers(ch => post({op: 'peers', list: ch.peers.filter(p => !p.sameTab && p.presence && p.presence.p).map(p => ({peer: p.peer, p: p.presence.p}))}),
        err => post({op: 'error', msg: err && err.code === 'not_granted' ? '공유받은 사람만 같은 방에 들어올 수 있어요' : '연결이 끊겼어요'}));
      post({op: 'joined'});
    } catch (err) { post({op: 'error', msg: err && err.code === 'not_permitted' ? '이 방은 열 수 없어요' : err && err.code === 'not_granted' ? '공유받은 사람만 같은 방에 들어올 수 있어요' : '연결하지 못했어요'}); }
  }
  if (d.op === 'presence' && RM.cur && d.data && typeof d.data === 'object') RM.cur.presence({p: d.data}).catch(() => {});
  if (d.op === 'leave') roomLeave();
});
