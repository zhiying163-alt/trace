const TINT = {blue:['#C9D0FF','#5263EC'], mint:['#D8F8E1','#43BE76'], butter:['#FFF1D2','#F0AE3E'], coral:['#FFD9D5','#EC6F64']};
const tintBg = k => `linear-gradient(145deg,${TINT[k][0]},${TINT[k][1]})`;
const ACC = {none:'없음', glasses:'AR 안경', beanie:'비니', ribbon:'리본'};
const SHAPES = {
  orb:{n:'구슬', dy:0, top:0, b:[94, 30], hl:[42, 38, -30], body:'<circle cx="60" cy="62" r="42"/>'},
  bear:{n:'젤리곰', dy:6, top:4, b:[98, 38], hl:[42, 46, -30], body:'<circle cx="29" cy="31" r="15"/><circle cx="91" cy="31" r="15"/><circle cx="60" cy="68" r="40"/>', over:'<circle cx="29" cy="31" r="7" fill="#fff" opacity=".28"/><circle cx="91" cy="31" r="7" fill="#fff" opacity=".28"/>'},
  drop:{n:'물방울', dy:12, top:4, b:[92, 50], hl:[44, 58, -40], body:'<path d="M60 12C60 12 100 52 100 76C100 98 82 110 60 110C38 110 20 98 20 76C20 52 60 12 60 12Z"/>'},
  bean:{n:'콩', dy:2, top:2, b:[96, 36], hl:[40, 42, -35], body:'<path d="M60 22C86 18 104 34 102 56C100 72 88 74 86 86C84 100 72 108 56 106C32 104 16 88 18 64C20 40 36 26 60 22Z"/>'},
  cloud:{n:'구름', dy:10, top:10, b:[100, 44], hl:[44, 46, -20], body:'<circle cx="42" cy="58" r="22"/><circle cx="72" cy="50" r="27"/><rect x="16" y="56" width="88" height="48" rx="24"/>'},
  capsule:{n:'캡슐', dy:-4, top:-4, b:[92, 22], hl:[44, 30, -15], body:'<rect x="28" y="12" width="64" height="98" rx="32"/>', over:'<path d="M28 86H92A32 32 0 0 1 28 86Z" fill="#fff" opacity=".32"/><path d="M28 86H92" stroke="#fff" stroke-width="2" opacity=".6"/>'}
};
const BADGE = {safe:['#2FA866','<path d="M-4 0l3 3 5-6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>'], warn:['#E39A22','<path d="M0-5v5M0 4.2v.3" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>'], risk:['#E5484D','<path d="M-3.5-3.5l7 7M3.5-3.5l-7 7" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>']};
function mascot(state = 'idle', tint = S.tint, acc = S.acc, shape = S.shape){
  if (state === 'none' || !['idle','wave','think','safe','warn','risk'].includes(state)) state = 'idle';
  const T = TINT.blue, H = SHAPES[shape] || SHAPES.orb, id = 'g' + (mascot.n = (mascot.n || 0) + 1), N = '#1D2A86';
  const L = `stroke="${N}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none"`;
  const star = (x, y, r) => `<path d="M${x} ${y - r}q.6 ${r * .8} ${r} ${r}q-${r * .4} .6-${r} ${r}q-.6-${r * .4}-${r}-${r}q${r * .8}-.6 ${r}-${r}z" fill="#fff"/>`;
  const eye = (x, dx = 0, dy = 0) => `<g class="ey" style="animation-delay:${-(mascot.n % 7) * .8}s"><ellipse cx="${x}" cy="62" rx="10" ry="14" fill="#fff"/><g class="pu"><ellipse cx="${x + dx}" cy="${65 + dy}" rx="6.2" ry="9" fill="${N}"/>${star(x + dx + 1.5, 61 + dy, 2.6)}</g></g>`;
  const eyes = {
    idle: eye(47) + eye(73), think: eye(47, 3, -6) + eye(73, 3, -6),
    warn: eye(47, 0, 3) + eye(73, 0, 3) + `<path d="M37 44l10 3M83 44l-10 3" ${L}/>`,
    safe: `<path d="M39 63q8-11 16 0M65 63q8-11 16 0" ${L}/>`, wave: `<path d="M39 63q8-11 16 0M65 63q8-11 16 0" ${L}/>`,
    risk: `<path d="M41 55l11 7-11 7M79 55l-11 7 11 7" ${L}/>`
  }[state];
  const mouth = {safe:`<path d="M53 76h14q-1 8-7 8t-7-8z" fill="${N}"/>`, wave:`<path d="M55 78q5 4 10 0" ${L}/>`, warn:`<path d="M53 81q3.5-3 7 0t7 0" ${L}/>`, risk:`<ellipse cx="60" cy="81" rx="4" ry="5" fill="${N}"/>`, think:`<path d="M57 81h6" ${L}/>`, idle:''}[state];
  const hat = acc === 'beanie' ? `<g transform="translate(0 ${H.top})"><path d="M30 46q2-28 30-28t30 28z" fill="${N}"/><rect x="26" y="40" width="68" height="10" rx="5" fill="${N}"/><circle cx="60" cy="16" r="6" fill="${N}"/></g>` : '';
  const rib = acc === 'ribbon' ? `<g transform="translate(36 ${28 + H.top}) rotate(-20)"><path d="M0 0l-11-8v16zM0 0l11-8v16z" fill="#EC6F64"/><circle r="4" fill="#C9473E"/></g>` : '';
  const gl = acc === 'glasses' ? `<g fill="#BFE3FF" fill-opacity=".35" stroke="${N}" stroke-width="3"><rect x="34" y="50" width="26" height="24" rx="9"/><rect x="60" y="50" width="26" height="24" rx="9"/></g><path d="M34 60l-9-3M86 60l9-3" stroke="${N}" stroke-width="3" stroke-linecap="round"/>` : '';
  const extra = state === 'wave' ? star(108, 26, 5) + star(114, 40, 3) : state === 'think' ? `<circle cx="98" cy="46" r="2.5" fill="${N}" opacity=".5"/><circle cx="105" cy="37" r="3.5" fill="${N}" opacity=".5"/>` : '';
  const b = BADGE[state], [hx, hy, hr] = H.hl;
  return `<svg class="rei" viewBox="0 0 120 120" width="100%" height="100%" role="img" aria-label="캐릭터 미리"><defs><radialGradient id="${id}" gradientUnits="userSpaceOnUse" cx="44" cy="34" r="92"><stop offset="0" stop-color="${T[0]}"/><stop offset="1" stop-color="${T[1]}"/></radialGradient></defs>
<ellipse cx="60" cy="112" rx="28" ry="4" fill="${N}" opacity=".1"/>
<g fill="url(#${id})">${H.body}</g>${H.over || ''}
<ellipse cx="${hx}" cy="${hy}" rx="12" ry="6.5" transform="rotate(${hr} ${hx} ${hy})" fill="#fff" opacity=".45"/>
${hat}<g transform="translate(0 ${H.dy})">${eyes}${mouth}${gl}</g>${rib}${extra}${b ? `<g transform="translate(${H.b[0]} ${H.b[1]})"><circle r="11" fill="${b[0]}" stroke="#fff" stroke-width="3"/>${b[1]}</g>` : ''}</svg>`;
}

/* ================= 식단 짜기 ================= */
// 같은 예측 모델로 후보 조합의 혈당 곡선을 계산하고, 목표 범위 안에 들어오는 조합 중에서 겹치지 않게 고른다
const PSLOT = {b: '아침', l: '점심', d: '저녁', s: '간식'};
const PPOOL = {
  bMain: ['통밀빵 2장', '현미밥', '잡곡밥', '오트밀', '찐 고구마'], bPro: ['삶은 달걀 2개', '그릭 요거트', '두부 부침', '계란말이'], bSide: ['사과', '바나나', '데친 브로콜리', null],
  main: ['현미밥', '잡곡밥', '흰쌀밥'], pro: ['고등어구이', '연어구이', '닭가슴살 구이', '두부 부침', '계란말이', '삼겹살 1인분'], veg: ['시금치나물', '데친 브로콜리', '오이무침'], soup: ['된장찌개', '미역국', '김치찌개', null],
  out: [['비빔밥'], ['쌀국수'], ['닭가슴살 샐러드'], ['김밥', '삶은 달걀 2개'], ['초밥 10피스', '미역국'], ['짬뽕'], ['크림 파스타', '닭가슴살 샐러드'], ['카레라이스', '오이무침']],
  snack: ['견과류 한 줌', '그릭 요거트', '사과', '삶은 달걀 2개', '데친 브로콜리']

const PEXC = {noodle: '면', bread: '빵', pork: '돼지고기', fish: '생선', dairy: '유제품'};
const pexcHit = (n, ex) => (ex.noodle && FOODS[n] && FOODS[n].cat === 'noodle') || (ex.bread && FOODS[n] && FOODS[n].cat === 'bread') || (ex.pork && /삼겹살|김치찌개/.test(n)) || (ex.fish && /고등어|연어|초밥/.test(n)) || (ex.dairy && /요거트|파스타/.test(n));
const pick = a => a[Math.floor(Math.random() * a.length)];
function planCombo(slot, o){
  const out = o.style === 'out' && (slot === 'l' || slot === 'd') && Math.random() < .6;

  else if (slot === 'b') items = [pick(PPOOL.bMain), pick(PPOOL.bPro), pick(PPOOL.bSide)];
  else if (out) items = pick(PPOOL.out).slice();

  if (items.some(n => pexcHit(n, o.ex) || (o.no || []).some(w => w && n.includes(w)))) return null;

}
function planScore(c, slot){
  const veg = c.items.some(it => ['side', 'veg', 'soup'].includes(FOODS[it.n].cat));
  const opt = {time: slot === 's' ? 'l' : slot, order: veg && c.items.length > 1 ? 'veg' : null};
  let R = predict(c.items, ctx(opt));
  // 목표를 넘으면 밥 양을 줄여 본다
  if (R.peak > R.hi - 10){ const ri = c.items.findIndex(it => /^(흰쌀밥|현미밥|잡곡밥)$/.test(it.n)); if (ri >= 0) for (const k of [.75, .5]){ c.items[ri].k = k; R = predict(c.items, ctx(opt)); if (R.peak <= R.hi - 10) break; } }

}
function planMeal(slot, o, used){
  const cand = [];
  for (let i = 0; i < 60; i++){ const c = planCombo(slot, o); if (c) cand.push(planScore(c, slot)); }
  if (!cand.length) return null;
  const pen = c => c.R.peak + c.items.reduce((s, it) => s + (used[it.n] || 0) * 45, 0) + (c.items.some(it => /삼겹살|크림 파스타|카레/.test(it.n)) ? 8 : 0);
  cand.sort((a, b) => pen(a) - pen(b));
  const ok = cand.filter(c => c.R.peak <= c.R.hi - 5), pool = (ok.length ? ok : cand).slice(0, 5), m = pick(pool);
  m.items.forEach(it => used[it.n] = (used[it.n] || 0) + 1);
  const tips = [];
  if (m.order === 'veg') tips.push('채소 → 단백질 → 밥 순서');
  if (m.items.some(it => it.k < 1)) tips.push(`${m.items.find(it => it.k < 1).n} ${m.items.find(it => it.k < 1).k === .5 ? '반' : '3/4'} 공기`);
  if (m.R.peak > m.R.hi - 25 && slot !== 's') tips.push('식후 10분 걷기');

}
function planMake(){
  const o = S.planOpt, days = o.days === 7 ? 7 : 1, used = {}, plan = [];
  for (let d = 0; d < days; d++){ const day = {meals: []}; Object.keys(used).forEach(k => used[k] *= .8); o.slots.forEach(s => { const m = planMeal(s, o, used); if (m) day.meals.push(m); }); plan.push(day); }

}
function planList(){ const c = {}; (S.plan ? S.plan.days : []).forEach(d => d.meals.forEach(m => m.items.forEach(it => { c[it.n] = (c[it.n] || 0) + it.k; }))); return Object.entries(c).sort((a, b) => b[1] - a[1]); }
function mealLine(m, di, mi){

function planV(){

    <div><label class="t">빼고 싶은 것</label><div class="chips wrap">${Object.keys(PEXC).map(k => `<button class="chip" aria-pressed="${!!o.ex[k]}" data-pex="${k}">${PEXC[k]}</button>`).join('')}</div></div>

/* ================= 인터랙션 (TRACE와 같은 효과) ================= */
// 스크롤·휠: 카드가 물결처럼 살짝 출렁인다. 히어로: 커서가 지나간 자리에 × 픽셀이 남았다 사라진다.
// 버튼: 눌린 자리에서 번지는 물결. 캐릭터: 누르면 말랑하게 눌리고, 눈이 커서를 따라본다. 히어로·마무리 카드: 커서를 따라 번지는 블루 빛
const FX = {amp: 0, t: 0, dir: 1, mx: -999, my: -999, raf: 0, fraf: 0, els: [], fields: [], prev: new WeakMap(),
  RM: window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches};
const WAVE_SEL = '#app .card, #app .row, #app .pred, #app .game-card, #app .hero, #app .sos-top, #app .call, #app .stage, #app .act, #app .pitem, #intro .in-row, #intro .phone, #intro .in-copy, #intro .in-end, #intro .ob-opts button';
function fxKick(){ if (!FX.raf && !FX.RM) FX.raf = requestAnimationFrame(fxLoop); }
function fxLoop(){
  FX.raf = 0; FX.amp *= .88; FX.t++;
  const on = FX.amp > .1;
  FX.els.forEach(el => {
    if (!on){ if (el.style.translate) el.style.translate = ''; return; }
    const r = el.getBoundingClientRect(); if (r.bottom < -50 || r.top > innerHeight + 50) return;
    el.style.translate = `0 ${(FX.amp * Math.sin(FX.t * .2 - (r.top + r.height / 2) * .011) * FX.dir).toFixed(2)}px`;
  });

}
function fxBind(){
  FX.els = FX.RM ? [] : [...document.querySelectorAll(WAVE_SEL)];
  FX.fields = [...document.querySelectorAll('canvas.wf')].filter(cv => cv.isConnected && cv.clientWidth).map(cv => {
    const W = cv.clientWidth, H = cv.clientHeight, d = Math.min(2, window.devicePixelRatio || 1), S = 9; cv.width = W * d; cv.height = H * d;
    const cols = Math.ceil(W / S), rows = Math.ceil(H / S);
    return {cv, W, H, d, S, cols, rows, v: new Float32Array(cols * rows), n: Float32Array.from({length: cols * rows}, () => Math.random())};
  });
  if (FX.fields.length && !FX.fraf && !FX.RM) FX.fraf = requestAnimationFrame(fieldLoop);
  fxEyes();
}
function fieldLoop(){
  FX.fraf = 0; let any = false; const R = 64;
  FX.fields.forEach(F => {
    if (!F.cv.isConnected) return; any = true;
    const b = F.cv.getBoundingClientRect(); if (b.bottom < 0 || b.top > innerHeight || !b.width) return;
    const g = F.cv.getContext('2d'), S = F.S; g.setTransform(F.d, 0, 0, F.d, 0, 0); g.clearRect(0, 0, F.W, F.H);
    const mx = FX.mx - b.left, my = FX.my - b.top, near = mx > -R && my > -R && mx < F.W + R && my < F.H + R;
    if (near){ const c0 = Math.max(0, Math.floor((mx - R) / S)), c1 = Math.min(F.cols - 1, Math.floor((mx + R) / S)), r0 = Math.max(0, Math.floor((my - R) / S)), r1 = Math.min(F.rows - 1, Math.floor((my + R) / S));
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++){ const i = r * F.cols + c, k = 1 - Math.hypot(c * S + S / 2 - mx, r * S + S / 2 - my) / R; if (k > 0 && F.n[i] < .35 + k * .8) F.v[i] = Math.max(F.v[i], k); } }

      const v = F.v[i]; if (v < .03) continue; F.v[i] = v * .955;
      const x = (i % F.cols) * S + S / 2, y = Math.floor(i / F.cols) * S + S / 2, a = 1.8;

      g.beginPath(); g.moveTo(x - a, y - a); g.lineTo(x + a, y + a); g.moveTo(x + a, y - a); g.lineTo(x - a, y + a); g.stroke();

}
function fxEyes(){
  FX.eq = 0; if (FX.mx < -900) return;
  document.querySelectorAll('svg.rei').forEach(sv => {
    const b = sv.getBoundingClientRect(); if (!b.width || b.bottom < 0 || b.top > innerHeight) return;
    const dx = FX.mx - (b.left + b.width / 2), dy = FX.my - (b.top + b.height / 2), dist = Math.hypot(dx, dy) || 1, m = Math.min(3.4, dist / 50);

addEventListener('pointermove', e => {
